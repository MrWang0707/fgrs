<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f6f6f7" />
<title>记账系统</title>
<style>
/* ===================== 基础 ===================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#0e0e10;background:#e6e6e8;-webkit-font-smoothing:antialiased}
:root{
  --ink:#0e0e10;--sub:#8a8a90;--bg:#f6f6f7;--card:#fff;
  --lime:#d8ff4f;--radius:18px;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"Roboto Mono",monospace;
}
.shell{position:relative;max-width:460px;min-height:100vh;margin:0 auto;background:var(--bg);box-shadow:0 0 0 1px rgba(0,0,0,.05),0 24px 80px rgba(0,0,0,.10);overflow-x:clip}
.page{display:none;padding:14px 14px calc(8px + env(safe-area-inset-bottom))}
.page.on,#sheetHost.show,#pickerHost.show{display:block}
/* 切板块：新页按滑块运动方向轻滑入，位移方向由内联 --dir 给（±14px） */
.pageIn{animation:pageIn 200ms cubic-bezier(.22,.61,.36,1) both}
@keyframes pageIn{from{opacity:0;transform:translateX(var(--dir,0px))}to{opacity:1;transform:none}}
body.lock{overflow:hidden}

/* ===================== 通用组件 ===================== */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:10px 2px 14px}
.phead h1{margin:0;font-size:23px;letter-spacing:-.6px;line-height:1.12}
.phead .sub{font-size:12px;color:var(--sub);margin-top:5px;letter-spacing:.2px}
.head-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.btn{appearance:none;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:8px 13px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-family:inherit;cursor:pointer;touch-action:manipulation;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.dark{background:#38383C;border-color:#38383C;color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn.wide{width:100%}
.card{background:var(--card);border:1px solid #ececee;border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.025)}
/* 净资产卡 */
.netcard{background:#fff;border:1px solid #ececee;border-radius:var(--radius);padding:14px 16px 12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.025)}
.net-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.net-label{font-size:11.5px;color:var(--sub);letter-spacing:.4px}
.net-val{display:flex;align-items:baseline;gap:2px;margin-top:2px}
.net-val .cur{font-size:14px;font-weight:600;color:var(--ink)}
.net-val b{font-size:25px;letter-spacing:-.8px;font-family:var(--mono);font-weight:700;line-height:1.05}
.net-pct{font-size:11px;color:var(--sub);font-family:var(--mono);white-space:nowrap;padding-bottom:3px}
.net-bar{height:6px;border-radius:4px;background:#eeeef0;margin:9px 0 6px;overflow:hidden}
.net-bar i{display:block;height:100%;background:var(--ink);border-radius:4px;width:0;transition:width .5s ease}
/* 三项并排会超宽：允许折行，窄屏自己分成两行，绝不裁字 */
.net-meta{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;row-gap:2px;font-size:11.5px;color:var(--sub);font-family:var(--mono)}
.net-meta span{white-space:nowrap}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card-head h2{margin:0;font-size:14.5px;letter-spacing:-.2px}
.mini{font-size:11px;color:var(--sub);letter-spacing:.1px}
.empty{padding:26px 8px;text-align:center;color:var(--sub);font-size:13px}
.empty .big{font-size:26px;display:block;margin-bottom:6px;opacity:.35}
.sched-none{padding:14px 2px;font-size:12.5px;color:#a8a8ad}
.cloud-btn{width:26px;height:26px;border-radius:8px;border:1px solid var(--ink);background:#fff;display:grid;place-items:center;position:relative;cursor:pointer;padding:0;color:var(--ink)}
.cloud-btn svg{width:15px;height:15px}
.cloud-btn i{position:absolute;right:-3px;bottom:-3px;width:7px;height:7px;border-radius:50%;background:#cfcfd4;border:1px solid #fff}
.cloud-state{font-size:12.5px;line-height:1.65;padding:10px 12px;border-radius:10px;background:#f6f6f7;border:1px solid #ececee;margin-bottom:12px;word-break:break-all}
.cloud-state b{font-family:var(--mono)}
.section-title{display:flex;align-items:center;justify-content:space-between;padding:6px 3px 8px;font-size:12px;color:var(--sub);letter-spacing:.5px}
.section-title b{color:var(--ink);font-size:13px;letter-spacing:0}
.section-title .st-r{display:flex;align-items:center;gap:6px}
.rows{background:#fff;border:1px solid #ececee;border-radius:var(--radius);padding:2px 12px;margin-bottom:12px}
.memo-sep{margin:14px 2px 2px;padding-top:12px;border-top:1px solid #f2f2f4;font-size:12px;color:#9a9aa2;letter-spacing:.02em}
.memo-sep:first-child{margin-top:4px;padding-top:2px;border-top:0}
.row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid #f2f2f4;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.row:last-child,.cm-row:last-child{border-bottom:0}
.row .t{font-family:var(--mono);font-size:11.5px;color:#9a9a9f;min-width:48px;letter-spacing:-.2px}
/* 花销行：时间 / 分类+今天 两行并成一栏，把横向空间让给标题 */
.row[data-exp] .t{min-width:60px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.row[data-exp] .t .sub{display:flex;align-items:center;gap:4px;line-height:1}
.row[data-exp] .t .dy{font-family:inherit;font-size:10px;color:#111;letter-spacing:0}
/* 非今天的花销行标周几，颜色压淡，不跟分类小标签抢注意力 */
.row[data-exp] .t .dw{font-family:inherit;font-size:10px;color:#a6a6ac;letter-spacing:0}
.row[data-exp] .t .tag{margin-left:0;font-size:9.5px;padding:1px 4px}
/* 备忘的「备案」小标跟花销分类小标签同一套字号字重 */
.row[data-memo] .t .tag{margin-left:0;font-size:9.5px;font-weight:600;padding:1px 4px;line-height:1}
.row .dur{display:block;font-size:10px;color:#a8a8ad;margin-top:3px;letter-spacing:0;font-family:inherit}
.row .name{font-size:14.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .desc{font-size:11.5px;color:#9a9a9f;margin-top:3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-family:var(--mono);font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .chev{width:12px;height:12px;color:#c4c4c9;flex-shrink:0}
.row.flash{animation:flash 1.8s ease;background:#f5fbdd}
/* 新条目入场：交给 keyframes 演，不靠 rAF 的帧时机——页面被节流时最多停一下，不会卡在 0 高度 */
.row.in,.week.in{overflow:hidden;animation:rowIn .38s cubic-bezier(.2,.8,.2,1) both,rowFade .32s linear both}
@keyframes rowIn{from{height:0;padding-top:0;padding-bottom:0;border-bottom-width:0;margin-bottom:0}
to{height:var(--inH);padding-top:var(--inPT);padding-bottom:var(--inPB);border-bottom-width:var(--inBB);margin-bottom:var(--inMB)}}
@keyframes rowFade{from{opacity:0}to{opacity:1}}
/* 日程列表：同一星期组合用同一浅色，不同组合各自一色 */
.row.tinted{border-radius:12px;padding-left:10px;margin:3px 0}
.row.now{background:#f5fbdd;border:1.5px solid var(--ink);border-radius:14px;box-shadow:inset 3px 0 0 var(--lime);padding:11px 10px;margin:5px 0}
.row.now .t,.tab.on,.picker-head button.ok{color:#111;font-weight:700}
.row.now .name{color:#111}

/* 备忘页顶部：标题 + 日历 + 搜索钉住不动，只有下面的备忘列表跟着滚；
   最后 14px 从底色渐变到透明，列表滑进来是淡出的，不会留一条直角硬边 */
.memo-sticky{position:sticky;top:0;z-index:6;padding:14px 14px 14px;margin:-14px -14px 0;
  background:linear-gradient(to bottom,var(--bg) calc(100% - 14px),rgba(246,246,247,0))}
/* 备忘搜索：钉在日历卡下面，跟卡片一起吸顶 */
.memo-search{display:flex;gap:8px;align-items:center;margin:10px 0 0}
/* ---------- 备忘日历 ---------- */
.cal{background:#fff;border:1px solid #ececee;border-radius:var(--radius);padding:12px 12px 8px;margin-bottom:0;box-shadow:0 1px 2px rgba(0,0,0,.025)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.cal-ht{display:flex;align-items:baseline;gap:7px;min-width:0;flex:1 1 auto;overflow:hidden}
.cal-title{font-size:15.5px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.cal-title .ly{font-family:inherit;font-size:10.5px;color:var(--sub);font-weight:500;margin-left:6px;letter-spacing:.2px}
/* 这张月历的农历月（丙午年 十月）：跟干支年同字号，窄屏只丢干支年，月份保留 */
.cal-title .lym{font-family:inherit;font-size:10.5px;color:var(--sub);font-weight:500;margin-left:5px;letter-spacing:.2px}
/* 选中日期的农历与节日：跟月份标题同一行，放不下就省略，不再单占一行 */
.cal-sub{font-size:11px;color:var(--sub);letter-spacing:.1px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cal-sub b{color:var(--ink);font-weight:600}
/* 折叠：只收日期格子，月份标题和翻月按钮留在卡面上，随时能展开 */
.cal-fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .34s cubic-bezier(.22,.61,.36,1)}
.cal-inner{min-height:0;overflow:hidden;transition:opacity .26s ease}
.cal.folded .cal-fold{grid-template-rows:0fr}
.cal.folded .cal-inner{opacity:0}
.cal.folded{padding-bottom:12px}
.cal-nav{display:flex;gap:4px;flex-shrink:0}
.cal-nav button{appearance:none;border:1px solid #eaeaee;background:#fff;color:var(--ink);height:26px;min-width:26px;padding:0 7px;border-radius:8px;font-family:inherit;font-size:11.5px;font-weight:600;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
/* 窄屏：先让出干支年、缩一点标题字号，再缩按钮，把农历日留出来（放在导航按钮规则之后才生效） */
@media (max-width:360px){.cal-title{font-size:14px}.cal-title .ly{display:none}.cal-sub{font-size:10.5px}.cal-nav{gap:3px}.cal-nav button{min-width:24px;padding:0 5px}}
.cal-nav button:active,.cm-btn:active{background:#f2f2f4}
.cal-nav button svg{width:12px;height:12px;transition:transform .32s cubic-bezier(.22,.61,.36,1)}
.cal.folded .cal-nav #calFold svg{transform:rotate(180deg)}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:2px}
.cal-wd span{text-align:center;font-size:10.5px;color:var(--sub);padding:3px 0;letter-spacing:.4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cal-cell{position:relative;appearance:none;border:1.5px solid transparent;background:transparent;border-radius:11px;padding:4px 0 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:inherit;color:var(--ink);cursor:pointer;touch-action:manipulation;min-height:40px}
.cal-cell:active{background:#f6f6f7}
.cal-cell .cd{font-size:13.5px;font-weight:700;font-family:var(--mono);line-height:1.05}
.cal-cell .cl{font-size:9px;color:#a2a2a8;line-height:1.05;white-space:nowrap}
.cal-cell .cl.fest{color:#3f3f45;font-weight:600}
.cal-cell.today,.cal-cell.today.sel{background:#f5fbdd}
.cal-cell.today .cl{color:#7d8a55}
.cal-cell.today .cd,.cal-cell.today.sel .cd{color:#d1352f}
.cal-cell.past .cd{color:#adadb3}
.cal-cell.past .cl{color:#c2c2c8}
.cal-cell.past .cl.fest{color:#b8b8be}
.cal-cell.past .mk{opacity:.72}
.cal-cell.sel{border-color:var(--ink);background:#fbfbfc}
.cal-cell.sel .cd{color:var(--ink)}
.cal-cell.sel .cl{color:#8a8a90}
.cal-cell.sel .cl.fest{color:#3f3f45}
.cal-cell .mk{position:absolute;right:3px;top:3px;min-width:12px;height:12px;border-radius:7px;background:var(--lime);border:1px solid var(--ink);font-size:8.5px;line-height:10px;text-align:center;color:#111;font-family:var(--mono);padding:0 2px}
.fest-note{background:#fff;border:1px solid #ececee;border-left:3px solid var(--lime);border-radius:14px;padding:10px 12px 11px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.025)}
.fest-note .fn-head{display:flex;align-items:baseline;gap:7px}
.fest-note .fn-head b{font-size:15px;letter-spacing:.2px}
.fest-note .fn-head span{font-size:10.5px;color:var(--sub);font-family:var(--mono)}
.fest-note p{margin:4px 0 0;font-size:12px;line-height:1.62;color:#5f5f65}
/* 备忘下方：换日期时旧卡片先渐隐、新卡片再渐显 */
#memoBody.fx-in{animation:memoIn .26s ease both}
#memoBody.fx-out{animation:memoOut .16s ease both}
@keyframes memoIn{from{opacity:0}to{opacity:1}}
@keyframes memoOut{from{opacity:1}to{opacity:0}}
@keyframes flash{0%,100%{background:transparent}18%{background:var(--lime)}}
.tag{display:inline-block;font-size:10px;font-weight:700;border-radius:6px;padding:1px 5px;border:1px solid var(--ink);background:var(--lime);color:#111;vertical-align:middle;margin-left:5px;letter-spacing:.2px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
.tag.plain{background:#fff;border-color:#d8d8dd;color:#6d6d73}
.tag.red{background:#38383C;color:#fff}

/* ===================== 首页 ===================== */
/* 余额区：一枚圆角深色卡，内部沿用原有排版（标签/大数字/分隔线两列统计/底行） */
.hero{position:relative;overflow:hidden;background:radial-gradient(125% 115% at 94% 4%,#404045 0%,#38383C 52%,#333338 100%);border-radius:20px;padding:18px 18px 16px;margin-bottom:12px;color:#fff}
.hero-waves{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.95;-webkit-mask-image:linear-gradient(96deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.55) 42%,#000 82%);mask-image:linear-gradient(96deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.55) 42%,#000 82%)}
.hero-waves path{fill:none;stroke:rgba(255,255,255,.16);stroke-width:1}
.hero-waves path.hi{stroke:rgba(255,255,255,.26)}
.bc-label{position:relative;font-size:11.5px;color:rgba(255,255,255,.72);letter-spacing:1.6px;font-weight:600}
.bc-amount{position:relative;display:flex;align-items:baseline;gap:3px;margin-top:5px;font-family:var(--mono);font-weight:800;font-size:38px;letter-spacing:-1.8px;line-height:1.1;font-variant-numeric:tabular-nums;color:#fff}
.bc-amount .cur{font-size:15px;letter-spacing:0;font-weight:700;transform:translateY(-1px);color:rgba(255,255,255,.6)}
.bc-grid{position:relative;display:grid;grid-template-columns:1fr 1fr;margin-top:15px;padding-top:13px;border-top:1px solid rgba(255,255,255,.18)}
.bc-grid .stat:last-child{padding-left:14px;border-left:1px solid rgba(255,255,255,.18)}
.stat span{display:block;font-size:10.5px;color:rgba(255,255,255,.6);letter-spacing:.5px}
.stat b{display:block;margin-top:4px;font-family:var(--mono);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.6px;color:#fff}
.bc-foot{position:relative;display:flex;justify-content:space-between;gap:10px;margin-top:13px;font-size:11px;color:rgba(255,255,255,.46)}
.hero .cloud-btn{position:absolute;top:16px;right:16px;border-color:rgba(255,255,255,.26);background:rgba(255,255,255,.14);color:#fff}
.hero .cloud-btn i{border-color:#38383C}
.chart-wrap{position:relative;height:152px;margin:2px 0 0}
.chart-wrap canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:pointer}
.chart-foot{display:flex;justify-content:space-between;font-size:10.5px;color:#a8a8ae;font-family:var(--mono);margin-top:4px}

/* 今日卡（首页「今天」的日程 + 备忘两栏） */
.today-card{display:block;width:100%;background:rgb(253,241,228);border:1px solid #f1e4d2;border-left:4px solid #e6c39c;color:#111;border-radius:14px;padding:11px 13px 12px;margin-bottom:12px;font-family:inherit;text-align:left;cursor:pointer;touch-action:manipulation}
.tc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tc-top .k{font-size:10.5px;letter-spacing:1.6px;color:#111;font-weight:700}
.tc-right{display:flex;align-items:center;gap:7px}
.tc-date{font-size:11px;color:#8a7a66;font-family:var(--mono)}
.tc-body{display:flex;align-items:stretch;gap:0;margin-top:7px}
.tc-col{flex:1 1 0;min-width:0}
.tc-col.tc-sched{padding-right:11px}
.tc-col.tc-memo{padding-left:11px;border-left:1px solid #eadbc6}
.tc-cap{display:flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:1px;color:#6f6152;font-weight:700;padding-bottom:4px;margin-bottom:3px;border-bottom:1px solid #f0e3d2}
.tc-dot{display:inline-block;width:6px;height:6px;border-radius:1.5px;background:#3a3a3f;flex-shrink:0}
.tc-dot.sched{background:#c58f52}
.tc-dot.memo{background:#9b653b}
.tc-tag{font-size:9.5px;font-weight:700;letter-spacing:.2px;font-family:var(--mono);color:#8a6a45;background:#fff;border:1px solid #f0e0c9;border-radius:5px;padding:0 4px;line-height:1.65;display:inline-block}
.tc-tag.live{background:#3a3a3f;border-color:#3a3a3f;color:#fff}
.tc-static{display:block;padding:2px 0}
.tc-v{display:block;font-size:13.5px;font-weight:600;color:#111;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-sub{display:block;font-size:11.5px;font-family:var(--mono);color:#8a7a66;margin-top:1px}

/* ===================== 花销 ===================== */
.search{display:flex;align-items:center;gap:8px;flex:1;height:40px;border:1px solid #e2e2e6;background:#fff;border-radius:12px;padding:0 11px;transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease}
.search svg{width:16px;height:16px;color:#a8a8ae;flex-shrink:0;transition:color .18s ease}
.search:focus-within{border-color:#38383C;box-shadow:0 0 0 3px rgba(56,56,60,.07)}
.search:focus-within svg{color:#38383C}
.search input{border:0;outline:0;flex:1;min-width:0;font-size:14px;font-family:inherit;background:none;color:#111}
.filter{padding:12px 12px 10px}
.f-cat-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid #f1f1f3}
.f-cat-cap{font-size:11px;color:#8a8a90;letter-spacing:.4px;margin-right:2px}
.f-row{display:flex;gap:8px;margin-top:9px}
.week{margin-bottom:10px;background:#fff;border:1px solid #ececee;border-radius:16px;overflow:hidden}
.wk-head{display:flex;align-items:center;gap:8px;width:100%;padding:12px 13px;background:none;border:0;font-family:inherit;text-align:left;cursor:pointer;touch-action:manipulation}
.wk-head .wk-label{flex:1;min-width:0;font-size:12.5px;color:#6d6d73;letter-spacing:.2px}
.wk-head .wk-sum{font-family:var(--mono);font-size:12.5px;font-weight:700;color:#111;white-space:nowrap}
.wk-head .chev{width:13px;height:13px;color:#b9b9bf;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.wk-head.open .chev{transform:rotate(180deg)}
.wk-body{border-top:1px solid #f2f2f4;padding:0 13px}
.wk-body.hide{display:none}
/* 分组的展开/折叠：由 keyframes 演高度，时间是固定的，不依赖逐帧时机 */
.wk-body.slide{overflow:hidden;will-change:height}
.wk-body.wkopen{animation:wkSlideOpen .28s cubic-bezier(.2,.8,.2,1) both}
.wk-body.wkclose{animation:wkSlideClose .26s cubic-bezier(.45,0,.6,1) both}
@keyframes wkSlideOpen{from{height:0}to{height:var(--wkh)}}
@keyframes wkSlideClose{from{height:var(--wkh)}to{height:0}}

/* ===================== 底部导航 ===================== */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:flex;background:#fff;border-top:1px solid #e6e6e8;padding:7px 2px calc(5px + env(safe-area-inset-bottom));z-index:60;
  transition:transform .3s cubic-bezier(.22,.68,.28,1);will-change:transform}
/* 往下滑：整条导航连着底边一起收进屏幕外；往上滑再滑回来（收起慢半拍，起步也放柔） */
.tabbar.hide{transform:translateX(-50%) translateY(calc(100% + 14px));transition-duration:.46s;transition-timing-function:cubic-bezier(.2,.24,.45,.95)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0;border:0;background:none;color:#a0a0a6;font-size:10.5px;font-family:inherit;cursor:pointer;touch-action:manipulation;position:relative}
.tab svg{width:21px;height:21px}
.tbib{position:absolute;top:0;left:0;width:16px;height:3px;border-radius:2px;background:#38383C;transform:translateX(0);transition:transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform;pointer-events:none}

/* ===================== 弹层 ===================== */
#sheetHost{position:fixed;inset:0;z-index:80;display:none}
#sheetHost .mask{position:absolute;inset:0;background:rgba(10,10,12,.34);opacity:0;transition:opacity .22s}
.sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:460px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fbfbfc;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 44px rgba(0,0,0,.18)}
/* 抽屉出场：从底部弹起，冲过落点一点点再回落停住；收起时干净地滑下去 */
#sheetHost.in .sheet{animation:sheetUp .44s cubic-bezier(.22,.86,.28,1) both}
#sheetHost.out .sheet{animation:sheetDown .22s cubic-bezier(.45,0,.9,.55) both}
@keyframes sheetUp{0%{transform:translate(-50%,100%)}68%{transform:translate(-50%,-1%)}100%{transform:translate(-50%,0)}}
@keyframes sheetDown{from{transform:translate(-50%,0)}to{transform:translate(-50%,100%)}}
#sheetHost.in .mask{opacity:1}
#sheetHost.in .sheet,#pickerHost.in .picker{transform:translate(-50%,0)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px 12px;position:sticky;top:0;background:#fbfbfc;z-index:2}
.sheet-head h2{margin:0;font-size:17px;letter-spacing:-.3px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;color:#83838a;margin-bottom:6px;letter-spacing:.5px;transform-origin:left bottom;transition:transform .18s cubic-bezier(.2,.8,.2,1),color .18s ease,letter-spacing .18s ease}
/* 点进输入区：标签向上缩一点、颜色压深；输入框描边提亮并带一圈浅浅的聚焦光 */
.field:has(.input:focus)>label,.field:has(.fake-input:focus)>label{transform:translateY(-2px) scale(.93);color:#3a3a40}
.field label.with-act{display:flex;align-items:center;justify-content:space-between}
.mini-link{background:none;border:0;padding:0;font-family:inherit;font-size:11.5px;letter-spacing:0;color:#55555c;text-decoration:underline;text-underline-offset:3px;cursor:pointer;touch-action:manipulation}
.cat-mgr{margin-top:9px;border:1px solid #e9e9ec;border-radius:12px;padding:2px 10px;background:#fafafb}
/* 分类提示：灰字一行，点一下才真的选上分类 */
.cat-hint{margin-top:7px;font-size:11.5px;color:#8f8f97;line-height:1.6;cursor:pointer}
.cat-hint[hidden]{display:none}
.cat-hint b{color:#38383C;font-weight:600}
.cat-mgr[hidden]{display:none}
.cm-tip{font-size:11px;color:#8a8a90;line-height:1.6;padding:7px 0 5px;border-bottom:1px solid #f1f1f3}
.cm-row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #f1f1f3}
.cm-idx{width:14px;font-family:var(--mono);font-size:10.5px;color:#b3b3b9;flex-shrink:0}
.cm-name{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-in{flex:1;min-width:0;font-family:inherit;font-size:13px;font-weight:600;color:#111;border:1px solid #38383C;border-radius:8px;padding:2px 7px;outline:none;background:#fff}
.cm-btn{border:1px solid #e2e2e6;background:#fff;border-radius:8px;min-width:26px;height:25px;font-size:12px;font-family:inherit;color:#55555c;cursor:pointer;padding:0 6px;touch-action:manipulation;flex-shrink:0}
.cm-btn[disabled]{opacity:.3;cursor:default}
.cm-btn.del{color:#b3302a;border-color:#f0d6d3}
.input{width:100%;height:46px;border-radius:12px;border:1px solid #e2e2e6;background:#fff;padding:0 12px;font-size:16px;color:#111;font-family:inherit;outline:0;transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
.input:focus{border-color:#38383C;box-shadow:0 0 0 3px rgba(56,56,60,.07)}
textarea.input{height:auto;min-height:92px;padding:11px 12px;resize:vertical;line-height:1.55}
.fake-input{width:100%;height:46px;border-radius:12px;border:1px solid #e2e2e6;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;font-size:15px;color:#111;font-family:inherit;cursor:pointer;touch-action:manipulation;text-align:left;transition:border-color .18s ease,box-shadow .18s ease}
.field:focus-within .fake-input,.fake-input:focus{border-color:#38383C;box-shadow:0 0 0 3px rgba(56,56,60,.07)}
.fake-input .ph{color:#b4b4ba}
.fake-input .val{font-family:var(--mono);letter-spacing:-.2px}
/* 输入框右侧的清空按钮 */
.inp-wrap{position:relative}
.inp-wrap .input{padding-right:38px}
.inp-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;padding:0;border:0;border-radius:50%;background:#f0f0f2;color:#8a8a90;font-family:inherit;font-size:13px;line-height:1;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.inp-x:active{background:#e3e3e7}
.inp-x.hide{display:none}
.seg{display:flex;gap:5px;background:#f0f0f2;padding:4px;border-radius:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-size:13px;color:#7a7a80;font-weight:600;font-family:inherit;cursor:pointer;touch-action:manipulation}
.seg button.on{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.09)}
/* 周/月 两格小开关：白色滑钮代替原选中态底色，滑动时先横向拉长再回形（弹性感） */
.seg.knobseg{position:relative}
.seg.knobseg .knob{position:absolute;top:3px;left:0;width:calc(50% - 2.5px);height:calc(100% - 6px);border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.09);pointer-events:none;z-index:0}
.seg.knobseg .knob.end{left:calc(50% + 2.5px)}
.seg.knobseg button{position:relative;z-index:1;background:none;box-shadow:none;color:#8b8b92;transition:color .2s ease}
.seg.knobseg button.on{background:none;box-shadow:none;color:#111}
.seg.knobseg .knob.to-r{animation:knobSegR .32s cubic-bezier(.32,.82,.4,1) both}
.seg.knobseg .knob.to-l{animation:knobSegL .32s cubic-bezier(.32,.82,.4,1) both}
@keyframes knobSegR{
  0%{left:0;transform-origin:left center;transform:scaleX(1)}
  38%{left:calc(30% - 3px);transform-origin:left center;transform:scaleX(1.3)}
  100%{left:calc(50% + 2.5px);transform-origin:left center;transform:scaleX(1)}
}
@keyframes knobSegL{
  0%{left:calc(50% + 2.5px);transform-origin:right center;transform:scaleX(1)}
  38%{left:calc(30% - 3px);transform-origin:right center;transform:scaleX(1.3)}
  100%{left:0;transform-origin:right center;transform:scaleX(1)}
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
/* 「每隔 N 个月」那排前面的小字，跟 chip 同高对齐 */
.chips .rep-lead{display:flex;align-items:center;font-size:11.5px;color:#a6a6ac;margin-right:1px}
.chips.err{outline:2px solid #d1352f;outline-offset:4px;border-radius:14px}
.chip{border:1px solid #e2e2e6;background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;color:#5e5e66;font-family:inherit;cursor:pointer;touch-action:manipulation;transition:background-color .18s ease,border-color .18s ease,color .18s ease,font-weight .18s ease}
.chip.on{background:#38383C;border-color:#38383C;color:#fff;font-weight:600}
.tag.cat,.chip.cat{background:var(--cb);border-color:var(--ce);color:var(--ct);font-weight:600}
.chip.cat.on{background:var(--ct);border-color:var(--ct);color:#fff}
.chip.add{border-style:dashed;color:#8f8f97;font-weight:600}
.chip-in{border:1px solid #38383C;background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;color:#111;font-family:inherit;width:96px;outline:none;transition:box-shadow .18s ease,border-color .18s ease}
.chip-in:focus{box-shadow:0 0 0 3px rgba(56,56,60,.07)}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.switch-row span{font-size:13.5px}
.sw{width:46px;height:27px;border-radius:999px;background:#dcdce1;border:0;position:relative;cursor:pointer;transition:background .18s;touch-action:manipulation;flex-shrink:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.sw.on{background:#38383C}
.sw.on:after{transform:translateX(19px)}
/* 弹性开关：滑钮起步先横向拉长，滑到另一端再收回原形 */
.sw.an-on:after{animation:knobOn .3s cubic-bezier(.3,.85,.4,1) both}
.sw.an-off:after{animation:knobOff .3s cubic-bezier(.3,.85,.4,1) both}
@keyframes knobOn{0%{width:21px;transform:translateX(0)}32%{width:27px;transform:translateX(0)}68%{width:27px;transform:translateX(14px)}100%{width:21px;transform:translateX(19px)}}
@keyframes knobOff{0%{width:21px;transform:translateX(19px)}32%{width:27px;transform:translateX(14px)}68%{width:27px;transform:translateX(4px)}100%{width:21px;transform:translateX(0)}}
.sheet-actions{display:flex;gap:9px;margin-top:16px}
.sheet-actions .btn{height:48px;border-radius:14px;font-size:15px}
.sheet-actions .btn.dark{flex:1}
/* 花销表单底部四颗按钮（删除/复制/一键备忘/保存）：窄屏收一下内边距，别把「保存」挤成竖排 */
.sheet-actions.x4{gap:8px}
@media (max-width:360px){
  .sheet-actions.x4{gap:6px}
  .sheet-actions.x4 .btn{padding:8px 8px;font-size:13.5px}
}
.hint{font-size:11px;color:#a0a0a6;line-height:1.5;margin-top:-4px;margin-bottom:12px}
/* 同名提醒：面板里的焦糖提示条，就地确认，不弹系统框 */
.dup-warn{background:rgb(253,241,228);border-left:4px solid #c98a4b;border-radius:12px;padding:10px 12px;margin:14px 0 0}
.dup-warn .dw-txt{font-size:12px;line-height:1.65;color:#6b5230}
.dup-warn .dw-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:9px}
/* 一句话确认浮层（如「已加入备忘，去看看？」）：居中白卡，两按钮，不做系统弹框 */
.ask{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:26px;opacity:0;transition:opacity .18s ease}
.ask.in{opacity:1}
.ask-mask{position:absolute;inset:0;background:rgba(17,17,19,.34)}
.ask-card{position:relative;width:100%;max-width:322px;background:#fff;border-radius:18px;padding:17px 16px 14px;box-shadow:0 18px 44px rgba(0,0,0,.20);transform:scale(.965);transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.ask.in .ask-card{transform:scale(1)}
.ask-t{font-size:15px;font-weight:700;color:#111;margin-bottom:7px}
.ask-d{font-size:12.5px;color:#6f6f78;line-height:1.65;margin-bottom:14px;word-break:break-word}
.ask-b{display:flex;gap:9px}
.ask-b .btn{flex:1;height:44px;border-radius:13px;font-size:14px}

/* 选择器 */
#pickerHost{position:fixed;inset:0;z-index:100;display:none}
#pickerHost .mask{position:absolute;inset:0;background:rgba(10,10,12,.34);opacity:0;transition:opacity .2s}
.picker{position:absolute;left:50%;bottom:0;transform:translate(-50%,110%);width:100%;max-width:460px;background:#fff;border-radius:20px 20px 0 0;padding:6px 10px calc(14px + env(safe-area-inset-bottom));transition:transform .28s cubic-bezier(.3,.9,.3,1);box-shadow:0 -12px 44px rgba(0,0,0,.18)}
#pickerHost.in .mask{opacity:1}
.picker-head{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 6px}
.picker-head .pk-title{font-size:13px;color:#9a9a9f}
.picker-head button{border:0;background:none;font-family:inherit;font-size:14.5px;color:#9a9a9f;padding:8px 6px;cursor:pointer}

.row .main,.pcol{flex:1;min-width:0}

.plist{height:190px;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative}

/* ---------- 工具 ---------- */

  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

  if (!s) return null;

  if (!m) return null;
  return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), 0, 0);

  if (!s) return null;

/* ---------- 净资产 / 还款进度 ---------- */
function repaidTotal() {
  return round2((state.repay || []).filter(r => r.completed).reduce((a, r) => a + (Number(r.amount) || 0), 0));
}
function debtLeft() { return Math.max(0, round2(debtTotal() - repaidTotal())); }
function repayPct() {
  const d = debtTotal();
  if (!(d > 0)) return 100;
  return Math.min(100, Math.round(repaidTotal() / d * 1000) / 10);
}
/* 净资产 = 手上的钱（余额） − 还没还的负债 */
function netWorth(t) { return round2(balanceAt(t) - debtLeft()); }
/* ---------- 提示 / 弹层 ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
/* 浮层出场：显示 → 锁滚动 → 下一帧淡入（面板与选择器共用）
   hostSeq 用来作废「打开后立刻又被关掉」时还挂在下一帧里的淡入回调 */
let hostSeq = 0;
function showHost(host) {
  const seq = ++hostSeq;
  host.classList.remove('out');
  host.classList.add('show');
  document.body.classList.add('lock');
  requestAnimationFrame(() => {
    if (seq === hostSeq && host.classList.contains('show')) host.classList.add('in');
  });
}
function openSheet(html) {
  $('#sheetBody').innerHTML = html;
  showHost($('#sheetHost'));
}
function closeSheet() {
  hostSeq++;
  const host = $('#sheetHost');
  host.classList.remove('in');
  host.classList.add('out');
  document.body.classList.remove('lock');
  setTimeout(() => {
    if (!host.classList.contains('in')) { host.classList.remove('show'); host.classList.remove('out'); $('#sheetBody').innerHTML = ''; }
  }, 230);
}
/* 表单保存/删除后的收尾：关面板 → 重绘 → 提示（没有提示语时只关板和重绘） */
function commitSheet(msg) {
  closeSheet();
  bumpData();
  if (msg) toast(msg);
}
/* 面板通用：标题栏 + 底部动作条 */
/* 页面骨架：标题行 / 小节标题行，各页面共用 */
function pageHead(title, sub, subId, actions) {
  return '<div class="phead"><div><h1>' + title + '</h1>' +
    (sub ? '<div class="sub"' + (subId ? ' id="' + subId + '"' : '') + '>' + sub + '</div>' : '') +
    '</div>' + (actions ? '<div class="head-actions">' + actions + '</div>' : '') + '</div>';
}
function sectionTitle(text, right) {
  return '<div class="section-title"><b>' + text + '</b>' +
    (right ? '<span class="st-r">' + right + '</span>' : '') + '</div>';
}
function sheetHead(title) {  return '<div class="sheet-head"><h2>' + title + '</h2><button class="btn ghost sm" data-close>取消</button></div>';
}
function sheetActions(delId, saveId) {
  return '<div class="sheet-actions">' + (delId ? '<button class="btn" id="' + delId + '">删除</button>' : '') +
    '<button class="btn dark" id="' + saveId + '">保存</button></div>';
}
/* 星期选择器（每天 + 周一…周日），选中态交由 bindWeekdayChips 绘制 */
function weekdayChips(id) {
  return '<div class="chips" id="' + id + '">' +
    '<button class="chip" data-wd="0">每天</button>' +
    [1, 2, 3, 4, 5, 6, 7].map(i => '<button class="chip" data-wd="' + i + '">周' + WD_CN[i % 7] + '</button>').join('') +
    '</div>';
}
/* 列表：点某一行 → 按 id 打开对应表单 */
function bindRowOpen(sel, attr, coll, open) {
  $$(sel + ' [' + attr + ']').forEach(b => b.addEventListener('click', () => {
    const it = coll.find(x => x.id === b.getAttribute(attr));
    if (it) open(it);
  }));
}
/* 表单通用：删除确认 + 落盘 + 收面板 + 刷新 */
function onDelete(sel, msg, commit) {
  const b = $(sel);
  if (!b) return;
  b.addEventListener('click', () => {
    if (!confirm(msg)) return;
    commit();
    commitSheet('已删除');
  });
}
/* 就地输入框：Enter 或失焦提交一次，Esc 取消并恢复原样 */
function inlineInput(textEl, cfg) {
  const inp = document.createElement('input');
  inp.className = cfg.cls || 'chip-in';
  inp.value = cfg.value || '';
  inp.maxLength = cfg.maxLength || 6;
  if (cfg.placeholder) inp.placeholder = cfg.placeholder;
  if (cfg.label) inp.setAttribute('aria-label', cfg.label);
  textEl.replaceWith(inp);
  inp.focus();
  if (cfg.select) inp.select();
  let settled = false;
  const finish = () => {
    if (settled) return;
    settled = true;
    cfg.commit(inp.value.trim());
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(); }
    else if (e.key === 'Escape') { settled = true; cfg.cancel(); }
  });
  inp.addEventListener('blur', finish);
}
/* 表单通用：「每天」独占 + 其余多选切换 */
function bindWeekdayChips(sel, get, set) {
  const paint = () => $$(sel + ' .chip').forEach(x => x.classList.toggle('on', csvList(get()).includes(x.dataset.wd)));
  paint();
  $$(sel + ' .chip').forEach(b => b.addEventListener('click', () => {
    const cur = csvList(get());
    const v = b.dataset.wd;
    let next;
    if (v === '0') next = cur.includes('0') ? [] : ['0'];
    else { const base = cur.filter(x => x !== '0'); next = base.includes(v) ? base.filter(x => x !== v) : base.concat(v); }
    set(next.join(','));
    paint();
  }));
}

  if (e.target.closest('[data-close]')) { e.preventDefault(); closeSheet(); }
});

/* 开关的弹性反馈：等开关自己的点击处理翻完状态，再按方向演一次滑钮拉长→收回 */
document.addEventListener('click', e => {

  if (!sw) return;
  sw.classList.remove('an-on', 'an-off');
  void sw.offsetWidth;
  sw.classList.add(sw.classList.contains('on') ? 'an-on' : 'an-off');
  clearTimeout(sw.__an);
  sw.__an = setTimeout(() => sw.classList.remove('an-on', 'an-off'), 340);
});

/* ---------- 自绘滚轮选择器 ---------- */
const ITEM_H = 40;
function openPicker(mode, value) {
  return new Promise(resolve => {
    const now = new Date();
    let init = { y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate(), h: now.getHours(), mi: now.getMinutes() };
    if (value) {
      if (mode === 'time') { const t = parseHM(value); if (t) { init.h = t.h; init.mi = t.m; } }
      else { const dt = parseDT(value); if (dt) { init.y = dt.getFullYear(); init.m = dt.getMonth() + 1; init.d = dt.getDate(); init.h = dt.getHours(); init.mi = dt.getMinutes(); } }
    }
    const st = { y: init.y, m: init.m, d: init.d, h: init.h, mi: init.mi };
    const host = $('#pickerHost');
    const Y0 = 2024, Y1 = 2031;
    const defs = [];
    if (mode === 'date' || mode === 'datetime') {
      defs.push({ key: 'y', label: '年', items: () => { const a = []; for (let v = Y0; v <= Y1; v++) a.push(v); return a; }, fmt: v => v + '年' });
      defs.push({ key: 'm', label: '月', items: () => { const a = []; for (let v = 1; v <= 12; v++) a.push(v); return a; }, fmt: v => pad2(v) + '月' });
      defs.push({ key: 'd', label: '日', items: () => { const a = []; for (let v = 1; v <= daysInMonth(st.y, st.m); v++) a.push(v); return a; }, fmt: v => pad2(v) + '日' });
    }
    if (mode === 'time' || mode === 'datetime') {
      defs.push({ key: 'h', label: '时', items: () => { const a = []; for (let v = 0; v <= 23; v++) a.push(v); return a; }, fmt: v => pad2(v) + '时' });
      defs.push({ key: 'mi', label: '分', items: () => { const a = []; for (let v = 0; v <= 59; v++) a.push(v); return a; }, fmt: v => pad2(v) + '分' });
    }
    const indexOf = { y: Math.min(Y1, Math.max(Y0, st.y)) - Y0, m: st.m - 1, d: st.d - 1, h: st.h, mi: st.mi };
    const title = mode === 'time' ? '选择时间' : mode === 'date' ? '选择日期' : '选择日期时间';

    host.innerHTML =
      '<div class="mask"></div>' +
      '<div class="picker">' +
        '<div class="picker-head"><button data-cancel>取消</button><span class="pk-title">' + title + '</span><button class="ok" data-ok>确定</button></div>' +
        '<div class="picker-cols">' +
          defs.map(d => '<div class="pcol" data-key="' + d.key + '"><div class="pcol-label">' + d.label + '</div><div class="plist" data-key="' + d.key + '"></div></div>').join('') +
          '<div class="pick-band"></div>' +
        '</div>' +
        '<div class="picker-hint">上下滑动选择，松手自动吸附</div>' +
      '</div>';
    showHost(host);

    const cols = {};
    defs.forEach(d => cols[d.key] = d);

    function fill(key, keepIdx) {
      const def = cols[key];
      const list = host.querySelector('.plist[data-key="' + key + '"]');
      if (!list) return;
      const items = def.items();
      list.innerHTML = '<div class="ppad"></div>' + items.map(v => '<div class="pitem">' + def.fmt(v) + '</div>').join('') + '<div class="ppad"></div>';
      let idx = keepIdx != null ? keepIdx : (indexOf[key] || 0);
      idx = Math.max(0, Math.min(items.length - 1, idx));
      indexOf[key] = idx;
      requestAnimationFrame(() => { list.scrollTop = idx * ITEM_H; paint(key); });
      list.addEventListener('scroll', () => {
        const i = Math.max(0, Math.min(items.length - 1, Math.round(list.scrollTop / ITEM_H)));
        indexOf[key] = i;
        paint(key);
        if ((key === 'y' || key === 'm') && !fill._t) {
          fill._t = setTimeout(() => {
            fill._t = null;
            readCols();
            const dList = host.querySelector('.plist[data-key="d"]');
            if (dList) {
              const oldIdx = indexOf.d;
              const n = daysInMonth(st.y, st.m);
              if (dList.children.length - 2 !== n) fill('d', Math.min(oldIdx, n - 1));
            }
          }, 140);
        }
      }, { passive: true });
      list.addEventListener('click', ev => {
        const it = ev.target.closest('.pitem');
        if (!it) return;
        const i = Array.from(list.querySelectorAll('.pitem')).indexOf(it);
        list.scrollTo({ top: i * ITEM_H, behavior: 'smooth' });
      });
    }
    function paint(key) {
      const list = host.querySelector('.plist[data-key="' + key + '"]');
      if (!list) return;
      const items = Array.from(list.querySelectorAll('.pitem'));
      const idx = indexOf[key];
      items.forEach((it, i) => it.classList.toggle('active', Math.abs(i - idx) <= 0));
    }
    function readCols() {
      const order = { y: 0, m: 1, d: 2, h: 3, mi: 4 };
      Object.keys(cols).forEach(k => {
        const list = host.querySelector('.plist[data-key="' + k + '"]');
        if (!list) return;
        const n = list.querySelectorAll('.pitem').length;
        indexOf[k] = Math.max(0, Math.min(n - 1, Math.round(list.scrollTop / ITEM_H)));
      });
      if (cols.y) st.y = Y0 + indexOf.y;
      if (cols.m) st.m = indexOf.m + 1;
      if (cols.d) st.d = indexOf.d + 1;
      if (cols.h) st.h = indexOf.h;
      if (cols.mi) st.mi = indexOf.mi;
      return order;
    }

    Object.keys(cols).forEach(k => fill(k));

    function done(val) {
      const h2 = $('#pickerHost');
      h2.classList.remove('in');
      if (!$('#sheetHost').classList.contains('show')) document.body.classList.remove('lock');
      setTimeout(() => { h2.classList.remove('show'); h2.innerHTML = '<div class="mask"></div>'; }, 260);
      resolve(val);
    }
    host.querySelector('[data-cancel]').addEventListener('click', () => done(null));
    host.querySelector('.mask').addEventListener('click', () => done(null));
    host.querySelector('[data-ok]').addEventListener('click', () => {
      readCols();
      st.d = Math.min(st.d, daysInMonth(st.y, st.m));
      let out;
      if (mode === 'time') out = pad2(st.h) + ':' + pad2(st.mi);
      else if (mode === 'date') out = st.y + '-' + pad2(st.m) + '-' + pad2(st.d);
      else out = st.y + '-' + pad2(st.m) + '-' + pad2(st.d) + 'T' + pad2(st.h) + ':' + pad2(st.mi);
      done(out);
    });
  });
}

const CHEV_RIGHT = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>';
const TABS = [
  { id: 'home', label: '首页' }, { id: 'expenses', label: '花销' },
  { id: 'agenda', label: '日程' }, { id: 'memos', label: '备忘' }
];
/* 底部导航随滚动收放：往下滑累计 26px 收起来，往上滑累计 16px 滑回来；
   回到顶部、切板块时一律展开。掉头就清零累计，小幅抖动不会误触发 */
const TAB_AUTO = { last: 0, acc: 0, hidden: false };
function tabbarHide(h) {
  if (TAB_AUTO.hidden === h) return;
  TAB_AUTO.hidden = h;
  tbMaxAt = -1e9;   /* 栏收放会改变可视区，下次滚动重新测一次高度 */
  const bar = $('#tabbar');
  if (bar) bar.classList.toggle('hide', h);
}
/* 滚动高频路径：scrollHeight 每读一次都要强制布局，滚动中途每帧读会拖帧。
   400ms 内复用同一次测量，留白收放后强制失效重测 */
let tbMaxY = 0, tbMaxAt = -1e9;
function scrollMaxY() {
  const t = performance.now();
  if (t - tbMaxAt > 400) {
    tbMaxAt = t;
    tbMaxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  }
  return tbMaxY;
}
function tabbarTrack() {
  const maxY = scrollMaxY();
  /* 夹到有效区间：到底/到顶继续拉时系统会给出越界值（橡皮筋回弹），夹掉后位移为 0，不误判 */
  const y = Math.min(Math.max(window.scrollY, 0), maxY);
  const d = y - TAB_AUTO.last;
  TAB_AUTO.last = y;
  if (y < 3) { TAB_AUTO.acc = 0; tabbarHide(false); return; }
  if (!d) return;
  /* 单次位移异常（回弹、锚点跳转、切板块）不参与方向累计 */
  if (d > 120 || d < -120) { TAB_AUTO.acc = 0; return; }
  if ((TAB_AUTO.acc > 0 && d < 0) || (TAB_AUTO.acc < 0 && d > 0)) TAB_AUTO.acc = 0;
  TAB_AUTO.acc += d;
  if (TAB_AUTO.acc > 26) tabbarHide(true);
  else if (TAB_AUTO.acc < -16) tabbarHide(false);
}
function renderTabbar() {
  $('#tabbar').innerHTML = TABS.map(t =>
    '<button class="tab' + (t.id === ui.curTab ? ' on' : '') + '" data-tab="' + t.id + '">' + ICONS[t.id] + '<span>' + t.label + '</span></button>'
  ).join('') + '<i class="tbib" id="tabInd"></i>';
  $$('#tabbar .tab').forEach(b => b.addEventListener('click', () => goTab(b.dataset.tab)));
  placeTabInd(false);
  TAB_AUTO.last = window.scrollY;
}
/* 黑色小滑块：一个元素靠 transform 滑到当前 Tab 居中位，动画交给合成层 */
function placeTabInd(anim) {
  const bar = $('#tabInd'), on = $('#tabbar .tab.on');
  if (!bar || !on) return;
  bar.style.transition = anim ? '' : 'none';
  bar.style.transform = 'translateX(' + (on.offsetLeft + on.offsetWidth / 2 - 8) + 'px)';
  if (!anim) requestAnimationFrame(() => { bar.style.transition = ''; });
}
const RENDERERS = {};
function goTab(tab) {
  if (tab === ui.curTab && ui.mounted[tab]) { if (tab === 'home') updateLive(); return; }
  const prev = ui.curTab;
  ui.scroll[ui.curTab] = window.scrollY;
  ui.curTab = tab;
  /* 往右边 Tab 切 → 从右侧滑入；往左切 → 从左侧滑入，跟小滑块的方向对得上 */
  const at = id => TABS.findIndex(t => t.id === id);
  const dir = (at(tab) > at(prev) ? 14 : -14) + 'px';
  $$('.page').forEach(p => {
    const on = p.dataset.tab === tab;
    p.classList.toggle('on', on);
    p.classList.remove('pageIn');
    if (!on) return;
    p.style.setProperty('--dir', dir);
    p.classList.add('pageIn');
  });
  $$('#tabbar .tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  placeTabInd(true);
  if (!ui.mounted[tab]) { ui.mounted[tab] = true; RENDERERS[tab](); }
  else if (ui.dirty[tab]) { ui.dirty[tab] = false; RENDERERS[tab](); }
  else if (tab === 'home') { updateLive(); }
  else if (tab === 'agenda') { renderAgenda(); }
  requestAnimationFrame(() => {
    window.scrollTo(0, ui.scroll[tab] || 0);
    /* 换板块时把滚动追踪归零并展开导航，别把上一个板块的滚动当成这一次的方向 */
    TAB_AUTO.last = ui.scroll[tab] || 0;
    TAB_AUTO.acc = 0;
    tabbarHide(false);
  });
}
function bumpData() {
  invalidateDerived();
  const y = window.scrollY;
  Object.keys(RENDERERS).forEach(t => {
    if (!ui.mounted[t]) return;
    if (t === ui.curTab) RENDERERS[t]();
    else ui.dirty[t] = true;
  });
  window.scrollTo(0, y);
}

/* =====================================================================
   首页
   ===================================================================== */
/* 这一天是否命中这条日程：星期含「每天」(0) 或命中当天星期。d 可传 Date，也可直接传 1–7 的星期号 */
/* 星期选择存的是逗号串：日程页 7 天 × N 条、10 秒一轮的「进行中」判断都在问同一串，
   按原串缓存成数字集合，别再每次都 split */
const wdCache = new WeakMap();
function wdSetOf(s) {
  const raw = String(s.weekday == null ? '' : s.weekday);
  const c = wdCache.get(s);
  if (c && c.raw === raw) return c.set;
  const set = new Set(csvNums(raw));
  wdCache.set(s, { raw, set });
  return set;
}
function schedOnDay(s, d) {
  const wd = (d instanceof Date) ? ((d.getDay() + 6) % 7) + 1 : Number(d);
  const set = wdSetOf(s);
  return set.has(0) || set.has(wd);
}
function schedCoversNow(s, now) {
  if (!schedOnDay(s, now)) return false;
  const cur = now.getHours() * 60 + now.getMinutes();
  const a = parseHM(s.start_time), b = parseHM(s.end_time);
  if (!a || !b) return false;
  const st = a.h * 60 + a.m, en = b.h * 60 + b.m;
  if (st === en) return false;
  if (st < en) return cur >= st && cur < en;
  return cur >= st || cur < en;
}
function scheduleNowAll(now = new Date()) {
  return state.schedule.filter(s => schedCoversNow(s, now));
}
/* 首页卡只看勾了「首页提醒」的日程 */
function scheduleActiveNow(now = new Date()) {
  return scheduleNowAll(now).filter(s => Number(s.home_remind) === 1);
}

/* ---------- 余额区的流线底纹（一次性生成，复用） ---------- */
const HERO_WAVES = (function () {
  const W = 380, H = 196, cx = -46, cy = 306;
  let out = '';
  for (let r = 152; r <= 540; r += 11) {
    const rx = r * 1.5, ry = r;
    let pts = '', started = false, n = 0;
    for (let x = 0; x <= W; x += 5) {
      const t = (x - cx) / rx;
      if (Math.abs(t) >= 0.995) continue;
      const wob = 13 * Math.sin(x * 0.0125 + 0.9) + 6 * Math.sin(x * 0.029 - 0.4);
      const y = cy - ry * Math.sqrt(1 - t * t) + wob;
      if (y < -26 || y > H + 26) continue;
      pts += (started ? 'L' : 'M') + x + ' ' + y.toFixed(1) + ' ';
      started = true; n++;
    }
    if (n > 3) out += '<path' + (r % 55 === 0 ? ' class="hi"' : '') + ' d="' + pts.trim() + '"/>';
  }
  return '<svg class="hero-waves" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' + out + '</svg>';
})();

let animRAF = null;
function animateAmount(node, target) {
  if (!node) return;
  if (ui.lastAmount == null) { ui.lastAmount = target; node.textContent = money(target); return; }
  const from = ui.lastAmount;
  ui.lastAmount = target;
  if (Math.abs(from - target) < 0.005) { node.textContent = money(target); return; }
  if (animRAF) cancelAnimationFrame(animRAF);
  const t0 = performance.now(), dur = 900;
  const step = t => {
    const k = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    node.textContent = money(from + (target - from) * e);
    if (k < 1) animRAF = requestAnimationFrame(step);
  };
  animRAF = requestAnimationFrame(step);
}

/* 当前没有进行中的日程时，取今天最近要开始的一条 */
function nextSchedToday(now = new Date()) {
  const cur = now.getHours() * 60 + now.getMinutes();
  return state.schedule.filter(s => {
    if (!schedOnDay(s, now)) return false;
    const a = parseHM(s.start_time);
    return !!a && (a.h * 60 + a.m) > cur;
  }).sort((a, b) => String(a.start_time).localeCompare(String(b.start_time)))[0] || null;
}

    .sort((a, b) => (a.memo_clock || '99:99').localeCompare(b.memo_clock || '99:99'));

  /* 点这张卡进日程页：今天那组无论之前被折叠过没有都强制打开，并滚到卡上显示的那条 */

/* ---------- 图表 ---------- */
let balProbe = null, balGeom = null;

/* 图表里的等宽字体栈只写一份 */
const MONO_STACK = '"SF Mono",ui-monospace,monospace';
const fontMono = (size, weight) => (weight ? weight + ' ' : '') + size + 'px ' + MONO_STACK;
function prepCanvas(cv) {
  if (!cv || !cv.clientWidth) return null;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth, H = cv.clientHeight;
  const bw = Math.round(W * dpr), bh = Math.round(H * dpr);
  if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  return { ctx, W, H };
}
function tracePath(ctx, pts, X, Y) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(X(p.t), Y(p.v)) : ctx.moveTo(X(p.t), Y(p.v)));
}
function dotAt(ctx, x, y) {
  ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#d8ff4f'; ctx.fill();
  ctx.strokeStyle = '#38383C'; ctx.lineWidth = 1.4; ctx.stroke();
}
function drawBalanceChart(force) {
  const cv = $('#chartBalance');
  if (!cv) return;
  /* 每 10 秒统一刷新时，图上的变化不到半个像素：同分钟内数据没变就跳过重绘 */
  const stamp = dataRev + '#' + Math.round(cv.clientWidth) + '#' + Math.floor(Date.now() / 60000);
  if (!force && cv.__bsig === stamp) return;
  cv.__bsig = stamp;
  const c = prepCanvas(cv);
  const cs = $('#cbStart'), ce = $('#cbEnd');
  if (!c) return;
  const { ctx, W, H } = c;
  const now = new Date();
  const endT = now.getTime();
  const startT = Math.min(ANCHOR.getTime(), endT);
  if (endT <= ANCHOR.getTime()) {
    ctx.fillStyle = '#a8a8ae'; ctx.font = '12px -apple-system,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('锚点 11月23日 09:00 之后开始累计收益', W / 2, H / 2);
    return;
  }
  const padL = 4, padR = 4, padT = 14, padB = 20;
  const pts = [{ t: startT, v: balanceAt(new Date(startT)) }];
  state.expenses.forEach(e => {
    const d = parseDT(e.expense_time);
    if (!d) return;
    const t = d.getTime();
    if (t > startT && t < endT) {
      pts.push({ t: t - 1, v: balanceAt(new Date(t - 1)) });
      pts.push({ t: t, v: balanceAt(d) });
    }
  });
  pts.push({ t: endT, v: balanceAt(now) });

  let mn = Infinity, mx = -Infinity;
  pts.forEach(p => { mn = Math.min(mn, p.v); mx = Math.max(mx, p.v); });
  if (mx === mn) { mx += 10; mn -= 10; }
  const pad = (mx - mn) * 0.12;
  mn -= pad; mx += pad;

  const X = t => padL + (t - startT) / (endT - startT) * (W - padL - padR);
  const Y = v => padT + (1 - (v - mn) / (mx - mn)) * (H - padT - padB);

  ctx.strokeStyle = '#f0f0f2'; ctx.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const y = padT + i * (H - padT - padB) / 3;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  const grad = ctx.createLinearGradient(0, padT, 0, H - padB);
  grad.addColorStop(0, 'rgba(216,255,79,.55)');
  grad.addColorStop(1, 'rgba(216,255,79,0)');
  tracePath(ctx, pts, X, Y);
  ctx.lineTo(X(endT), H - padB); ctx.lineTo(X(startT), H - padB); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  tracePath(ctx, pts, X, Y);
  ctx.strokeStyle = '#38383C'; ctx.lineWidth = 1.7; ctx.stroke();

  const lp = pts[pts.length - 1];
  dotAt(ctx, X(lp.t), Y(lp.v));

  const t1 = new Date(startT), t2 = new Date((startT + endT) / 2), t3 = now;
  ctx.font = fontMono('10');
  ctx.fillStyle = '#a8a8ae';
  ctx.textAlign = 'center';
  ctx.fillText(fmtHM(t2), W / 2, H - 6);
  ctx.textAlign = 'left';
  ctx.fillText(fmtHM(t1), 2, H - 6);
  if (cs) cs.textContent = '起点 ' + mdCn(t1) + ' ' + fmtHM(t1);
  if (ce) ce.textContent = '现在 ' + fmtHM(t3);

  balGeom = { startT: startT, endT: endT, padL: padL, padR: padR, padT: padT, padB: padB, W: W, H: H };
  if (balProbe != null) {
    const pt = Math.max(startT, Math.min(endT, balProbe));
    const px = X(pt), pv = balanceAt(new Date(pt)), py = Y(pv);
    ctx.save();
    ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(14,14,16,.30)';
    ctx.beginPath(); ctx.moveTo(px, padT); ctx.lineTo(px, H - padB); ctx.stroke();
    ctx.restore();
    dotAt(ctx, px, py);

    const d = new Date(pt);
    const vtxt = '¥' + money(pv);
    const ttxt = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + fmtHM(d);
    ctx.font = fontMono('12.5', '700');
    const w1 = ctx.measureText(vtxt).width;
    ctx.font = fontMono('10');
    const w2 = ctx.measureText(ttxt).width;
    const bw = Math.max(w1, w2) + 16, bh = 34;
    let bx = px - bw / 2, by = py - bh - 9;
    bx = Math.max(2, Math.min(W - bw - 2, bx));
    if (by < 0) by = py + 9;
    ctx.beginPath();
    const rr = 8;
    ctx.moveTo(bx + rr, by);
    ctx.lineTo(bx + bw - rr, by); ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + rr);
    ctx.lineTo(bx + bw, by + bh - rr); ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - rr, by + bh);
    ctx.lineTo(bx + rr, by + bh); ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - rr);
    ctx.lineTo(bx, by + rr); ctx.quadraticCurveTo(bx, by, bx + rr, by);
    ctx.closePath();
    ctx.fillStyle = '#38383C'; ctx.fill();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = fontMono('12.5', '700');
    ctx.fillText(vtxt, bx + bw / 2, by + 15);
    ctx.fillStyle = 'rgba(255,255,255,.62)';
    ctx.font = fontMono('10');
    ctx.fillText(ttxt, bx + bw / 2, by + 27);
    ctx.textAlign = 'left';
  }
}

let probeRAF = 0;
function bindBalanceProbe() {
  const cv = $('#chartBalance');
  if (!cv || cv.dataset.probe) return;
  cv.dataset.probe = '1';
  const redraw = () => {
    if (probeRAF) return;
    probeRAF = requestAnimationFrame(() => { probeRAF = 0; drawBalanceChart(true); });
  };
  const pick = clientX => {
    if (!balGeom) return;
    const r = cv.getBoundingClientRect();
    const g = balGeom;
    const x = clientX - r.left;
    const t = g.startT + (x - g.padL) / (g.W - g.padL - g.padR) * (g.endT - g.startT);
    balProbe = Math.max(g.startT, Math.min(g.endT, t));
    redraw();
  };
  cv.addEventListener('pointerdown', e => {
    pick(e.clientX);
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener('pointermove', e => {
    if (balProbe == null) return;
    if (e.pointerType === 'touch' && !e.buttons) return;
    pick(e.clientX);
  });
  cv.addEventListener('pointerup', e => pick(e.clientX));
}

let bucketsMemo = null, bucketsKey = '';
function spendBuckets(mode) {
  const now = new Date();
  /* 同一周期内数据没变就不再重算（每 10 秒刷新会调用这里） */
  const key = mode + '#' + dataRev + '#' + (mode === 'week' ? weekStart(now).getTime() : now.getFullYear() + '-' + now.getMonth());
  if (bucketsMemo && bucketsKey === key) return bucketsMemo;
  const arr = [];
  if (mode === 'week') {
    const cur = weekStart(now);
    for (let i = 7; i >= 0; i--) {
      const ws = addDays(cur, -i * 7);
      arr.push({ from: ws, to: addDays(ws, 7), label: (ws.getMonth() + 1) + '/' + ws.getDate() });
    }
  } else {
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      arr.push({ from: d, to: new Date(d.getFullYear(), d.getMonth() + 1, 1), label: (d.getMonth() + 1) + '月' });
    }
  }
  /* 直接查已缓存的前缀和（时间已排序）拿每桶合计：不再遍历全表 parseDT、归桶 */
  ensureDerived();
  bucketsMemo = arr.map(b => {
    const lo = expIdx(b.from, false), hi = expIdx(b.to, false);
    const isCur = mode === 'week'
      ? fmtDate(b.from) === fmtDate(weekStart(now))
      : (b.from.getFullYear() === now.getFullYear() && b.from.getMonth() === now.getMonth());
    return { label: b.label, v: round2(expPrefix[hi] - expPrefix[lo]), cur: isCur };
  });
  bucketsKey = key;
  return bucketsMemo;
}
let spendAnimTimer = null;
function drawSpendChart(pre, anim) {
  const cv = $('#chartSpend');
  const c = prepCanvas(cv);
  if (!c) return;
  const { ctx, W, H } = c;
  const data = pre || spendBuckets(ui.spendMode);
  const max = Math.max(1, ...data.map(d => d.v));
  const padT = 18, padB = 20, gap = 6;
  const bw = (W - gap * (data.length - 1)) / data.length;
  const chartH = H - padT - padB;
  /* 每帧整块重画：柱高 × 进度 p，柱顶文字与标签随之淡入。
     用 setInterval + 绝对时间推进（内嵌浏览器会跳 rAF 帧，绝对时间才稳） */
  const paint = p => {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = '#f0f0f2'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, H - padB); ctx.lineTo(W, H - padB); ctx.stroke();
    data.forEach((d, i) => {
      const x = i * (bw + gap);
      const h = Math.max(2, d.v / max * chartH) * p;
      const y = H - padB - h;
      ctx.fillStyle = d.cur ? '#38383C' : '#cfcfd4';
      const r = Math.min(4, bw / 3);
      ctx.beginPath();
      ctx.moveTo(x, H - padB);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.lineTo(x + bw - r, y);
      ctx.quadraticCurveTo(x + bw, y, x + bw, y + r);
      ctx.lineTo(x + bw, H - padB);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = p;
      if (d.v > 0) {
        ctx.fillStyle = '#6d6d73';
        ctx.font = fontMono('9');
        ctx.textAlign = 'center';
        ctx.fillText(d.v >= 1000 ? (d.v / 1000).toFixed(1) + 'k' : String(Math.round(d.v)), x + bw / 2, y - 5);
      }
      ctx.fillStyle = '#a8a8ae';
      ctx.font = '9.5px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(d.label, x + bw / 2, H - 6);
      ctx.globalAlpha = 1;
    });
    if (data.every(d => d.v === 0)) {
      ctx.fillStyle = '#b4b4ba'; ctx.font = '12px -apple-system,sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('这段时间还没有花销记录', W / 2, H / 2);
    }
  };
  clearInterval(spendAnimTimer); spendAnimTimer = null;
  if (!anim) { paint(1); return; }
  const t0 = performance.now(), dur = 520;
  paint(0);
  spendAnimTimer = setInterval(() => {
    const p = Math.min(1, (performance.now() - t0) / dur);
    paint(1 - Math.pow(1 - p, 3));
    if (p >= 1) { clearInterval(spendAnimTimer); spendAnimTimer = null; }
  }, 16);
}

/* ---------- 还款计划 ---------- */
function renderRepayList() {
  const box = $('#repayList');
  if (!box) return;
  const list = state.repay.slice().sort((a, b) => {
    if (a.completed !== b.completed) return a.completed ? 1 : -1;
    return String(a.plan_date).localeCompare(String(b.plan_date));
  });
  const pending = list.filter(r => !r.completed);
  const sum = $('#repaySum');
  if (sum) sum.textContent = pending.length ? ('待还 ' + pending.length + ' 笔 · ¥' + money(pending.reduce((a, r) => a + r.amount, 0))) : '全部已还';
  if (!list.length) { box.innerHTML = '<div class="empty"><span class="big">◻</span>还没有还款计划</div>'; return; }
  const today = fmtDate(new Date());
  box.innerHTML = list.map(r => {
    const overdue = !r.completed && r.plan_date < today;
    return '<button class="row" data-repay="' + r.id + '">' +
      '<span class="t">' + mdShort(r.plan_date) + '</span>' +
      '<span class="main"><span class="name">' + esc(r.note || '还款') + (overdue ? '<span class="tag red">已逾期</span>' : r.completed ? '<span class="tag plain">已还</span>' : '') + '</span>' +
      '<span class="desc">' + (overdue ? '已过计划还款日' : r.completed ? '已还清' : '待还') + '</span></span>' +
      '<span class="amt">¥' + money(r.amount) + '</span></button>';
  }).join('');
  bindRowOpen('#repayList', 'data-repay', state.repay, openRepayForm);
}

function openRepayForm(init) {
  const r = Object.assign({ id: null, plan_date: fmtDate(new Date()), amount: '', note: '', completed: false }, init || {});
  openSheet(
    sheetHead(r.id ? '编辑还款计划' : '新增还款计划') +
    '<div class="field"><label>计划还款日期</label><button class="fake-input" id="rpDate"><span class="val" id="rpDateVal">' + mdWd(parseDT(r.plan_date)) + '</span><span class="mini">选择 ›</span></button></div>' +
    '<div class="field"><label>金额</label><input class="input" id="rpAmount" type="number" inputmode="decimal" placeholder="0.00" value="' + (r.amount === '' ? '' : r.amount) + '"></div>' +
    '<div class="field"><label>备注</label><input class="input" id="rpNote" placeholder="信用卡分期 / 车贷 / 房贷…" value="' + esc(r.note) + '"></div>' +
    '<div class="sheet-actions">' +
      (r.id ? '<button class="btn" id="rpToggle">' + (r.completed ? '恢复未还' : '标记已还') + '</button><button class="btn" id="rpDel">删除</button>' : '') +
      '<button class="btn dark" id="rpSave">保存</button>' +
    '</div>'
  );
  let dateVal = r.plan_date;
  bindPickerField({
    btn: '#rpDate', label: '#rpDateVal', mode: 'date',
    get: () => dateVal, set: v => { dateVal = v; }, text: v => mdWd(parseDT(v))
  });
  $('#rpSave').addEventListener('click', () => {
    const amount = Number($('#rpAmount').value);
    if (!(amount > 0)) { toast('请填写金额'); return; }
    if (!dateVal) { toast('请选择日期'); return; }
    const obj = { id: r.id || uid(), plan_date: dateVal, amount: round2(amount), note: $('#rpNote').value.trim(), completed: !!r.completed, created_at: r.id ? r.created_at : fmtDT(new Date()) };
    if (r.id) state.repay = upsertById(state.repay, obj);
    else state.repay.unshift(obj);
    persist('repay');
    commitSheet('已保存');
  });
  if (r.id) {
    $('#rpToggle').addEventListener('click', () => {
      state.repay = state.repay.map(x => x.id === r.id ? Object.assign({}, x, { completed: !x.completed }) : x);
      persist('repay'); commitSheet();
      toast(r.completed ? '已恢复未还' : '已标记还清');
    });
    onDelete('#rpDel', '删除这条还款计划？', () => {
      state.repay = dropById(state.repay, r.id);
      persist('repay');
    });
  }
}

}

const CAT_HINT_N = CAT_HINTS.map(p => [p[0], p[1].map(catNorm)]);
const CAT_FORM_N = CAT_FORM.map(p => [p[0], p[1].map(catNorm)]);

/* 分类名 → 固定色槽：改名换色、调序不换色 */
const CAT_TONE = { '餐饮': 0, '数码': 1, '服饰': 2, '护理': 3, '日用': 4, '会员': 5, '宠物': 6, '家电': 7, '汽车': 8, '医疗': 9, '孩子': 10, '休闲': 11, '旅行': 12, '人情': 13 };
/* 分类清单：存在 K.cats（整份有序数组），删掉的就不再补回来 */
let catsMemo = null, catsMemoSrc = null;
function allCats() {
  if (catsMemo && catsMemoSrc === state.cats) return catsMemo;
  let arr = (Array.isArray(state.cats) ? state.cats : []).map(c => String(c || '').trim())
    .filter(c => c && c !== LEGACY_CAT);
  arr = arr.filter((c, i) => arr.indexOf(c) === i);
  if (!arr.length) arr = EXP_CATS.slice();
  catsMemoSrc = state.cats;
  catsMemo = arr;
  return arr;
}
/* 猜分类：只返回一个分类名（可能空串），调用方拿去显示成提示 */
function guessCat(name) {
  const s = catNorm(name);
  if (!s) return '';
  const cats = allCats();
  const cnt = {};
  let near = 0;
  /* 1) 老账：先找名字完全一样的，再找「名字互相包含」的（新写了后缀也不会丢） */
  for (const r of state.expenses) {
    const c = expCat(r);
    if (!c) continue;
    const p = catNorm(r.item_name);
    if (!p) continue;
    if (p === s) cnt[c] = (cnt[c] || 0) + 100;
    else if (p.length >= 2 && s.length >= 2 && (p.indexOf(s) >= 0 || s.indexOf(p) >= 0)) cnt[c] = (cnt[c] || 0) + 10;
  }
  let best = '', bestN = 0;
  for (const k in cnt) if (cnt[k] > bestN) { best = k; bestN = cnt[k]; }
  if (best && bestN >= 100 && cats.indexOf(best) >= 0) return best;
  near = bestN >= 10 && cats.indexOf(best) >= 0 ? bestN : 0;
  /* 2) 形态词：卡 / 会员 / 储值这类词最硬，直接定类，免得「麦当劳麦金卡」被店名判成餐饮 */
  let formCat = '', formLen = 0;
  for (const pair of CAT_FORM_N) {
    if (cats.indexOf(pair[0]) < 0) continue;
    for (const w of pair[1]) if (w && s.indexOf(w) >= 0 && w.length > formLen) { formCat = pair[0]; formLen = w.length; }
  }
  if (formCat) return formCat;
  /* 3) 关键词：先只看「买了什么东西」，店名/平台名退到第二档，不能压过品类词 */
  const scan = onlyBrands => {
    let bc = '', bw = 0, bs = 0;
    for (const pair of CAT_HINT_N) {
      if (cats.indexOf(pair[0]) < 0) continue;
      let mx = 0, sum = 0;
      for (const w of pair[1]) {
        if (!w || s.indexOf(w) < 0 || CAT_BRAND_SET.has(w) !== onlyBrands) continue;
        if (w.length > mx) mx = w.length;
        sum += w.length;
      }
      if (!mx) continue;
      if (mx > bw || (mx === bw && sum > bs)) { bc = pair[0]; bw = mx; bs = sum; }
    }
    return bc;
  };
  const byItem = scan(false);
  if (byItem) return byItem;
  const byBrand = scan(true);
  if (byBrand) return byBrand;
  return near ? best : '';
}
function setCats(list) {
  state.cats = list.map(c => String(c || '').trim()).filter(c => c && c !== LEGACY_CAT)
    .filter((c, i, a) => a.indexOf(c) === i);
  persist('cats');
  return state.cats;
}
function catColor(name) {
  const t = CAT_TONE[name];
  if (t !== undefined) return CAT_COLORS[t];
  /* 未登记的（新增）分类：按名单顺序占第一个空闲色槽，保证互不撞色 */
  const taken = {};
  for (const c of allCats()) {
    const k = CAT_TONE[c];
    if (k !== undefined) { taken[k] = 1; continue; }
    let h = 0;
    for (const ch of String(c)) h += ch.charCodeAt(0);
    let i = h % CAT_COLORS.length;
    for (let n = 0; n < CAT_COLORS.length && taken[i]; n++) i = (i + 1) % CAT_COLORS.length;
    taken[i] = 1;
    if (c === name) return CAT_COLORS[i];
  }
  return CAT_COLORS[0];
}
function catChip(name, on, extra) {
  const c = catColor(name);
  return '<button class="chip cat' + (on ? ' on' : '') + (extra || '') + '" data-cat="' + esc(name) + '"' +
    ' style="--cb:' + c.bg + ';--ce:' + c.edge + ';--ct:' + c.tx + '">' + esc(name) + '</button>';
}
function catTag(name) {
  const c = catColor(name);
  return '<span class="tag cat" style="--cb:' + c.bg + ';--ce:' + c.edge + ';--ct:' + c.tx + '">' + esc(name) + '</span>';
}
/* 把某个分类的账清成不分类（不改数组长度、不动其它字段），返回改动条数 */
function uncatExpenses(name) {
  let n = 0;
  state.expenses = state.expenses.map(r => {
    if (expCat(r) !== name) return r;
    n++;
    const o = Object.assign({}, r); delete o.category; return o;
  });
  return n;
}
/* 旧数据迁移：把「其它」分类并掉（记录变成不分类），只跑一次 */
function migrateLegacyCats() {
  let changed = false;
  if (Array.isArray(state.cats) && state.cats.indexOf(LEGACY_CAT) >= 0) {
    state.cats = state.cats.filter(c => c !== LEGACY_CAT);
    persist('cats');
    changed = true;
  }
  if (uncatExpenses(LEGACY_CAT)) {
    persist('expenses');
    changed = true;
  }
  return changed;
}
/* 旧数据迁移：老备忘把时刻写在 memo_time 里，拆到独立的 memo_clock，只跑一次 */
function migrateMemoClock() {
  if (!Array.isArray(state.memos)) return false;
  let changed = false;
  state.memos = state.memos.map(m => {
    if (m.memo_clock !== undefined) return m;
    const hit = String(m.memo_time || '').match(/\d{1,2}:\d{2}/);
    if (!hit) return m;
    changed = true;
    return Object.assign({}, m, { memo_time: memoDayKey(m) || m.memo_time, memo_clock: hit[0] });
  });
  if (changed) persist('memos');
  return changed;
}
function filterActive() {
  return !!ui.expF.kw.trim() || (ui.expF.cats && ui.expF.cats.length > 0);
}
/* 基础表（解析时间 + 倒序排好）按数据版本缓存：改关键词时只重过滤，不重解析重排 */
var expBase = null, expBaseKey = '';
function expenseBase() {
  const catsSig = state.cats ? state.cats.length + ':' + state.cats.join(',') : '';
  const key = dataRev + '#' + catsSig;
  if (expBase && expBaseKey === key) return expBase;
  const out = [];
  for (const r of state.expenses) {
    const d = parseDT(r.expense_time);
    if (!d) continue;
    /* 分类与小写搜索串各算一次：改关键词时只做字符串比对，不再每条账都 String + toLowerCase */
    out.push({ r: r, t: d.getTime(), rc: expCat(r), nl: String(r.item_name || '').toLowerCase(), rl: String(r.remark || '').toLowerCase() });
  }
  out.sort((a, b) => b.t - a.t);
  expBase = out; expBaseKey = key;
  return out;
}
/* 一次解析、一次排序：后续分组与渲染都用这里算好的时间戳 */
function expenseRows() {
  const kw = ui.expF.kw.trim().toLowerCase();
  const catFilter = (ui.expF.cats || []).filter(c => allCats().indexOf(c) >= 0);
  const base = expenseBase();
  if (!kw && !catFilter.length) return base;
  const out = [];
  for (const row of base) {
    if (catFilter.length && catFilter.indexOf(row.rc) < 0) continue;
    if (kw) {
      if (row.nl.indexOf(kw) < 0 && row.rl.indexOf(kw) < 0 && row.rc.toLowerCase().indexOf(kw) < 0) continue;
    }
    out.push(row);
  }
  return out;
}

function paintFilterCats() {
  const box = $('#fCats');
  if (!box) return;
  const sel = (ui.expF.cats || []).filter(c => allCats().indexOf(c) >= 0).slice(0, 1);
  ui.expF.cats = sel;
  /* 只有分类清单变了才重建 chip（重建会掐掉颜色过渡）；单纯换选中只改高亮 */
  const listSig = allCats().join('|');
  if (box.__sig !== listSig) {
    box.__sig = listSig;
    box.innerHTML = '<span class="f-cat-cap">分类</span>' +
      allCats().map(c => catChip(c, sel.indexOf(c) >= 0)).join('');
    $$('#fCats .chip[data-cat]').forEach(b => b.addEventListener('click', () => {
      const c = b.dataset.cat;
      ui.expF.cats = (ui.expF.cats || [])[0] === c ? [] : [c];
      paintFilterCats();
      renderExpenseList();
    }));

  $$('#fCats .chip[data-cat]').forEach(b => b.classList.toggle('on', sel.indexOf(b.dataset.cat) >= 0));

/* 分组体的展开/折叠：把自然高度写进 --wkh，剩下交给 CSS keyframes 演完；演完恢复自适应高度 */
function slideWeekBody(body, opening) {
  if (!body) return;
  const tok = body.__tok = (body.__tok || 0) + 1;
  const clear = () => {
    body.classList.remove('slide', 'wkopen', 'wkclose');
    body.style.removeProperty('--wkh');
    body.style.height = '';
  };
  body.classList.remove('slide', 'wkopen', 'wkclose');
  if (opening) {
    body.classList.remove('hide');
    const h = body.getBoundingClientRect().height;
    if (!h) return;
    body.style.setProperty('--wkh', h + 'px');
    void body.offsetHeight;
    body.classList.add('slide', 'wkopen');
  } else {
    const h = body.getBoundingClientRect().height;
    if (!h) { body.classList.add('hide'); return; }
    body.style.setProperty('--wkh', h + 'px');
    void body.offsetHeight;
    body.classList.add('slide', 'wkclose');
  }
  const finish = () => {
    if (body.__tok !== tok) return;
    clear();
    if (!opening) body.classList.add('hide');
  };
  const onEnd = e => {
    if (e.target !== body || e.animationName.indexOf('wkSlide') !== 0) return;
    body.removeEventListener('animationend', onEnd);
    finish();
  };
  body.addEventListener('animationend', onEnd);
  setTimeout(finish, 400);
}
function toggleWeek(head) {
  if (filterActive()) return;
  const k = Number(head.dataset.week);
  const wasOpen = head.classList.contains('open');
  ui.weekToggle[k] = !wasOpen;
  head.classList.toggle('open', !wasOpen);
  slideWeekBody(head.nextElementSibling, !wasOpen);
}
function renderExpenseList() {
  const box = $('#exWeeks');
  if (!box) return;
  const active = filterActive();
  const rows = expenseRows();
  const sum = round2(rows.reduce((a, x) => a + x.r.amount, 0));
  const sub = $('#exSub');
  if (sub) sub.textContent = rows.length + ' 笔 · 合计 ¥' + money(sum) + (active ? '（筛选后）' : '');

  if (!rows.length) {
    const emptySig = 'empty#' + dataRev + '#' + active;
    if (box.__sig !== emptySig) {
      box.__sig = emptySig;
      box.innerHTML = '<div class="empty"><span class="big">◻</span>' + (active ? '没有符合筛选条件的花销' : '还没有花销记录，点右上角的「＋ 花销」') + '</div>';
    }
    return;
  }
  const nowD = new Date();
  const todayStr = fmtDate(nowD);
  /* 是不是「今天」用毫秒区间判断，不再每条账都格式化一遍日期字符串 */
  const dayFrom = dayStart(nowD).getTime(), dayTo = addDays(nowD, 1).getTime();
  const groups = new Map();
  /* 周键直接用毫秒算术推：当前周起点已知，往前按 7 天整减，省掉每条账都 new Date + weekStart */
  const ws0 = weekStart(nowD).getTime(), WEEK_MS = 604800000;
  rows.forEach(it => {
    const ws = ws0 + Math.floor((it.t - ws0) / WEEK_MS) * WEEK_MS;
    let g = groups.get(ws);
    if (!g) { g = { ws: new Date(ws), items: [] }; groups.set(ws, g); }
    g.items.push(it);
  });
  const keys = Array.from(groups.keys()).sort((a, b) => b - a);
  const curWeek = ws0;
  const opens = keys.map(k => active ? true : (ui.weekToggle[k] !== undefined ? ui.weekToggle[k] : k === curWeek));
  /* 内容签名：命中就不重建整块 DOM（边打字边刷新时，结果没变的那几次直接跳过） */
  const sig = dataRev + '#' + todayStr + '#' + active + '#' + rows.length + '#' + sum + '#' +
    keys.map((k, i) => k + (opens[i] ? '+' : '-')).join(',');
  box.__groups = groups;
  if (box.__sig === sig) return;
  box.__sig = sig;

  /* 一行一笔账的 HTML；折叠着的周先不生成，展开时再补（大账本省一半以上渲染时间） */
  const rowsHtmlOf = items => items.map(it => {
    const d = new Date(it.t);
    const cat = it.rc;
    const isToday = it.t >= dayFrom && it.t < dayTo;
    /* 今天写「今天」，以前的日子只写周几——周分组头上已经有日期范围了 */
    return '<button class="row" data-exp="' + it.r.id + '">' +
      '<span class="t"><span>' + fmtHM(d) + '</span>' +
        '<span class="sub">' + (cat ? catTag(cat) : '') +
          (isToday ? '<span class="dy">今天</span>' : '<span class="dw">周' + WD_CN[d.getDay()] + '</span>') +
        '</span>' +
      '</span>' +
      '<span class="main"><span class="name">' + esc(it.r.item_name) + '</span>' +
        (it.r.remark ? '<span class="desc">' + esc(it.r.remark) + '</span>' : '') + '</span>' +
      '<span class="amt">-' + money(it.r.amount) + '</span></button>';
  }).join('');

  box.innerHTML = keys.map((k, i) => {
    const g = groups.get(k);
    const total = round2(g.items.reduce((a, x) => a + x.r.amount, 0));
    const isCur = k === curWeek;
    const open = opens[i];
    const we = addDays(g.ws, 6);
    return '<div class="week">' +
      '<button class="wk-head' + (open ? ' open' : '') + '" data-week="' + k + '">' +
        '<span class="wk-label">' + mdCn(g.ws) + ' - ' + mdCn(we) + (isCur ? ' <span class="tag">本周</span>' : '') + '</span>' +
        '<span class="wk-sum">¥' + money(total) + '</span>' + CHEV_DOWN +
      '</button>' +
      '<div class="wk-body' + (open ? '' : ' hide') + '" data-lazy="' + (open ? '0' : '1') + '">' +
      (open ? rowsHtmlOf(g.items) : '') +
      '</div></div>';
  }).join('');

  if (!box.dataset.bind) {
    box.dataset.bind = '1';
    box.addEventListener('click', ev => {
      const head = ev.target.closest('.wk-head');
      if (head) {
        const wasOpen = head.classList.contains('open');
        const body = head.nextElementSibling;
        /* 懒生成的折叠体先把行补进来，再交给折叠动画去量高度 */
        if (!wasOpen && body && body.dataset.lazy === '1' && box.__groups) {
          const g = box.__groups.get(Number(head.dataset.week));
          if (g) body.innerHTML = rowsHtmlOf(g.items);
          body.dataset.lazy = '0';
        }
        toggleWeek(head);
        return;
      }
      const row = ev.target.closest('[data-exp]');
      if (row) {
        const r = state.expenses.find(x => x.id === row.dataset.exp);
        if (r) openExpenseForm(r);
      }
    });
  }
  /* 刚记的一笔：找到了就演入场（找不到说明被筛选挡掉了，直接不演） */
  if (ui.newExpId) {
    const nr = box.querySelector('[data-exp="' + ui.newExpId + '"]');
    ui.newExpId = null;
    if (nr) animAddExpenseRow(nr);
  }
}
/* 让某一行闪一下：先摘掉再补上，连点两次也能重新播 */

/* 删一条花销的退场：行先淡出，再收高度把下面的条目带上移；若是该周最后一条，连整张周卡一起收掉。
   重绘放在动画结束之后，避免条目录被提前掀掉、下面的行瞬间跳上去 */
function animRemoveExpenseRow(row, done) {
  if (!row || !row.parentNode) { done(); return; }
  const card = row.closest('.week');
  const body = row.closest('.wk-body');
  const alone = !!(body && body.querySelectorAll('.row').length === 1);
  let ended = false;
  const finish = () => { if (ended) return; ended = true; done(); };
  row.style.transition = 'opacity .17s ease';
  row.style.opacity = '0';
  const h = row.getBoundingClientRect().height;
  setTimeout(() => {
    if (!row.parentNode) return finish();
    /* 这一周就剩它一条：直接收整张周卡，别留一个光杆头部 */
    if (alone && card && card.parentNode) {
      const ch = card.getBoundingClientRect().height;
      card.style.overflow = 'hidden';
      card.style.height = ch + 'px';
      card.style.transition = 'height .2s ease, opacity .2s ease, margin-bottom .2s ease';
      void card.offsetHeight;
      card.style.height = '0px';
      card.style.opacity = '0';
      card.style.marginBottom = '0px';
      setTimeout(finish, 220);
      return;
    }
    row.style.height = h + 'px';
    row.style.overflow = 'hidden';
    row.style.transition = 'height .19s ease, padding .19s ease, border-bottom-width .19s ease';
    void row.offsetHeight;
    row.style.height = '0px';
    row.style.paddingTop = '0px';
    row.style.paddingBottom = '0px';
    row.style.borderBottomWidth = '0px';
    setTimeout(finish, 210);
  }, 180);
}
/* 新条目的入场：从 0 高度 + 透明长到自然高度，渐显；高度连续增长会把下面的条目一起往下推。
   若是该周的第一条，连整张周卡一起长出来；演完清掉内联样式，恢复自适应高度 */
function animAddExpenseRow(row) {
  if (!row || !row.parentNode) return;
  const card = row.closest('.week');
  const body = row.closest('.wk-body');
  const alone = !!(body && body.querySelectorAll('.row').length === 1);
  const el = (alone && card) ? card : row;
  const rc = el.getBoundingClientRect();
  const h = rc.height;
  if (!h) return;
  const cs = getComputedStyle(el);
  if (rc.top < 70 || rc.bottom > window.innerHeight - 90) {
    try { el.scrollIntoView({ block: 'center' }); } catch (e) { }
  }
  /* 目标值写进自定义属性，由 CSS keyframes 一口气演完，演完清掉恢复自适应高度 */
  el.style.setProperty('--inH', h + 'px');
  el.style.setProperty('--inPT', cs.paddingTop);
  el.style.setProperty('--inPB', cs.paddingBottom);
  el.style.setProperty('--inBB', cs.borderBottomWidth);
  el.style.setProperty('--inMB', cs.marginBottom);
  const done = () => {
    el.classList.remove('in');
    ['--inH', '--inPT', '--inPB', '--inBB', '--inMB'].forEach(k => el.style.removeProperty(k));
  };
  el.classList.add('in');
  el.addEventListener('animationend', function oe(e2) {
    if (e2.animationName !== 'rowIn') return;
    el.removeEventListener('animationend', oe);
    done();
  });
  setTimeout(done, 620);
}
function flashExpense(id) {
  if (ui.curTab !== 'expenses') return;
  const row = document.querySelector('#exWeeks [data-exp="' + id + '"]');
  if (!row) return;
  const rc = row.getBoundingClientRect();
  if (rc.top < 70 || rc.bottom > window.innerHeight - 90) {
    try { row.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { row.scrollIntoView(); }
  }
  flashEl(row, 1800);
}
