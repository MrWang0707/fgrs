  const p = $('#p-agenda');
  const now = new Date();
  const nowIds = scheduleNowAll(now).map(s => s.id);
  const nowSet = new Set(nowIds);
  const byTime = (a, b) => {
    const am = parseHM(a.start_time), bm = parseHM(b.start_time);
    return ((am ? am.h * 60 + am.m : 0) - (bm ? bm.h * 60 + bm.m : 0));
  };
  const all = state.schedule.slice().sort(byTime);
  /* 按天分组：今天起连排 7 天，每天一块，空的也留一块 */
  const days = [];
  for (let i = 0; i < 7; i++) {
    const day = addDays(now, i);
    const wd = ((day.getDay() + 6) % 7) + 1;
    days.push({ i, wd, list: all.filter(s => schedOnDay(s, wd)) });
  }
  const dayLabel = g => {
    const w = '周' + WD_CN[g.wd % 7];
    if (g.i === 0) return '今天 · ' + w;
    if (g.i === 1) return '明天 · ' + w;
    return mdCn(addDays(now, g.i)) + ' · ' + w;
  };

  // 每个不同的星期组合各分配一个浅色（每天固定第一色，进行中固定黄绿）
  const groups = [];
  all.forEach(s => {
    const sig = schedSig(s);
    if (!groups.some(g => g.sig === sig)) groups.push({ sig, label: weekdayName(sig) });
  });
  groups.sort((a, b) => {
    if (a.sig === '0') return -1;
    if (b.sig === '0') return 1;
    return Number(a.sig.split(',')[0]) - Number(b.sig.split(',')[0]);
  });
  const colorMap = {};
  let ci = 0;
  groups.forEach(g => {
    if (g.sig === '0') colorMap[g.sig] = SCH_TINTS[0];
    else { ci += 1; colorMap[g.sig] = SCH_TINTS[ci % SCH_TINTS.length]; }
  });

  const fmtDur = mins => {
    if (!mins || mins <= 0) return '';
    if (mins < 60) return mins + '分钟';
    const h = mins / 60;
    const v = Math.abs(h - Math.round(h)) < 1e-9 ? String(Math.round(h)) : h.toFixed(1).replace(/\.0$/, '');
    return v + '小时';
  };
  const rowHtml = s => {
    const a = parseHM(s.start_time), b = parseHM(s.end_time);
    const cross = a && b && (a.h * 60 + a.m) > (b.h * 60 + b.m);
    const dur = (a && b) ? ((b.h * 60 + b.m - (a.h * 60 + a.m) + 1440) % 1440) : 0;
    const durTxt = fmtDur(dur);                 /* 原来一行里要算两遍 */
    const sigRow = schedSig(s);                 /* 一次算好，色块与底色共用 */
    const isNow = nowSet.has(s.id);
    const bg = isNow ? '' : ' style="background:' + colorMap[sigRow] + '"';
    return '<button class="row' + (isNow ? ' now' : ' tinted') + '"' + bg + ' data-sch="' + s.id + '">' +
      '<span class="t">' + s.start_time + (durTxt ? '<span class="dur">' + durTxt + '</span>' : '') + '</span>' +
      '<span class="main"><span class="name">' + esc(s.content) + (isNow ? '<span class="tag">NOW</span>' : '') + (Number(s.home_remind) === 1 ? '<span class="tag plain">首页提醒</span>' : '') + '</span>' +
      '<span class="desc">' + s.start_time + ' – ' + (cross ? '次日 ' : '') + s.end_time + ' · ' + esc(s.weekday_str || weekdayName(s.weekday)) + '</span></span>' + CHEV_RIGHT + '</button>';
  };

  /* 今天默认展开，其余天默认折叠；展开状态按日期记，重渲染后保持 */
  const dayKey = g => fmtDate(addDays(now, g.i));
  const isOpen = g => ui.schedToggle[dayKey(g)] !== undefined ? ui.schedToggle[dayKey(g)] : g.i === 0;
  const bodyOf = g => g.list.length
    ? g.list.map(rowHtml).join('')
    : '<div class="sched-none">' + (g.i === 0 ? '今天没有日程安排' : '没有安排') + '</div>';
  const dayRows = new Map();
  days.forEach(g => dayRows.set(dayKey(g), bodyOf(g)));

  p.innerHTML =
    pageHead('日程', state.schedule.length + ' 项日程', '',
      '<button class="btn dark" id="addSch">＋ 日程</button>') +
    days.map(g => {
      const open = isOpen(g);
      return '<div class="week">' +
          '<button class="wk-head' + (open ? ' open' : '') + '" data-sday="' + dayKey(g) + '">' +
            '<span class="wk-label">' + dayLabel(g) + '</span>' +
            '<span class="wk-sum">' + g.list.length + ' 项</span>' + CHEV_DOWN +
          '</button>' +
          '<div class="wk-body' + (open ? '' : ' hide') + '" data-lazy="' + (open ? '0' : '1') + '">' +
            (open ? bodyOf(g) : '') + '</div>' +
        '</div>';
    }).join('');

  $('#addSch').addEventListener('click', () => openScheduleForm(null));
  p.__dayRows = dayRows;

  /* 折叠头与行点击都用容器委托：折叠的列表是懒生成的，行不能逐个绑 */
  if (!p.dataset.schBind) {
    p.dataset.schBind = '1';
    p.addEventListener('click', ev => {
      const head = ev.target.closest('.wk-head');
      if (head) {
        const key = head.dataset.sday;
        const wasOpen = head.classList.contains('open');
        ui.schedToggle[key] = !wasOpen;
        head.classList.toggle('open', !wasOpen);
        const body = head.nextElementSibling;
        if (body) {
          if (!wasOpen && body.dataset.lazy === '1') {
            body.innerHTML = (p.__dayRows && p.__dayRows.get(key)) || '';
            body.dataset.lazy = '0';
          }
          slideWeekBody(body, !wasOpen);
        }
        return;
      }
      const row = ev.target.closest('[data-sch]');
      if (row) {
        const it = state.schedule.find(x => x.id === row.dataset.sch);
        if (it) openScheduleForm(it);
      }
    });
  }
  ui.schedSig = fmtDate(now) + '#' + nowIds.join('|');
}

function openScheduleForm(init) {
  const s = Object.assign({ id: null, start_time: '07:00', end_time: '08:00', content: '', weekday: '0', home_remind: 1 }, init || {});
  openSheet(
    sheetHead(s.id ? '编辑日程' : '新增日程') +
    '<div class="f-row" style="margin-top:0">' +
      '<div class="field" style="flex:1;margin-bottom:0"><label>开始时间</label><button class="fake-input" id="sStart"><span class="val" id="sStartVal">' + s.start_time + '</span></button></div>' +
      '<div class="field" style="flex:1;margin-bottom:0"><label>结束时间</label><button class="fake-input" id="sEnd"><span class="val" id="sEndVal">' + s.end_time + '</span></button></div>' +
    '</div>' +
    '<div class="hint" style="margin-top:8px" id="sHint"></div>' +
    '<div class="field"><label>内容</label><input class="input" id="sContent" placeholder="晨跑 / 深度工作 / 阅读" value="' + esc(s.content) + '"></div>' +
    '<div class="field"><label>适用星期（可多选，选"每天"则只作用于每天）</label>' + weekdayChips('sWd') + '</div>' +
    '<div class="switch-row"><span>首页提醒（到点显示在首页顶部）</span><button class="sw' + (s.home_remind ? ' on' : '') + '" id="sSw"></button></div>' +
    sheetActions(s.id ? 'sDel' : '', 'sSave')
  );
  let start = s.start_time, end = s.end_time;
  function hint() {
    const a = parseHM(start), b = parseHM(end);
    const h = $('#sHint');
    if (a && b && (a.h * 60 + a.m) > (b.h * 60 + b.m)) h.textContent = '跨天日程：从今天 ' + start + ' 到次日 ' + end;
    else h.textContent = '同一天 ' + start + ' – ' + end;
  }
  hint();
  bindPickerField({
    btn: '#sStart', label: '#sStartVal', mode: 'time',
    get: () => start, set: v => { start = v; }, text: v => v, after: hint
  });
  bindPickerField({
    btn: '#sEnd', label: '#sEndVal', mode: 'time',
    get: () => end, set: v => { end = v; }, text: v => v, after: hint
  });
  bindWeekdayChips('#sWd', () => s.weekday, v => { s.weekday = v; });
  $('#sSw').addEventListener('click', () => {
    s.home_remind = s.home_remind ? 0 : 1;
    $('#sSw').classList.toggle('on', !!s.home_remind);
  });
  $('#sSave').addEventListener('click', () => {
    const content = $('#sContent').value.trim();
    if (!content) { toast('请填写内容'); $('#sContent').focus(); return; }
    const wd = csvList(s.weekday).sort((a, b) => Number(a) - Number(b)).join(',');
    if (!wd) { toast('请至少选择一个适用星期'); return; }
    const obj = {
      id: s.id || uid(),
      start_time: start, end_time: end, content,
      weekday: wd,
      weekday_str: weekdayName(wd),
      home_remind: s.home_remind ? 1 : 0,
      created_at: s.id ? s.created_at : fmtDT(new Date())
    };
    if (s.id) state.schedule = upsertById(state.schedule, obj);
    else state.schedule.push(obj);
    persist('schedule');
    commitSheet('已保存');
  });
  if (s.id) {
    onDelete('#sDel', '删除这条日程？', () => {
      state.schedule = dropById(state.schedule, s.id);
      persist('schedule');
    });
  }
}

/* =====================================================================
   备忘
   ===================================================================== */
function memoDayKey(m) {
  const d = parseDT(m.memo_time);
  return d ? fmtDate(d) : '';
}
/* 定期备忘：从起始日起，每周某天 / 每月某号 / 每 N 个月某号命中一次；小月没有 31 号就落到月末那天 */
function memoRepeatText(m) {
  if (!m.repeat) return '';
  if (m.repeat === 'week') return '每周' + WD_CN[Number(m.repeat_v) % 7];
  if (m.repeat === 'nmonth') return '每' + (Number(m.repeat_n) || 2) + '月' + (Number(m.repeat_v) || 1) + '号';
  return '每月' + (Number(m.repeat_v) || 1) + '号';
}
/* pre 可选：日历一整月循环里把起始日和当月天数各算一次，省掉每天重复解析日期、重建 Date */
function memoHitsDate(m, dt, pre) {
  const st = pre ? pre.st : parseDT(m.memo_time);
  if (!m.repeat) return !!st && fmtDate(st) === fmtDate(dt);
  if (st && dt.getFullYear() * 372 + dt.getMonth() * 31 + dt.getDate() <
           st.getFullYear() * 372 + st.getMonth() * 31 + st.getDate()) return false;
  if (m.repeat === 'week') return ((dt.getDay() + 6) % 7) + 1 === Number(m.repeat_v);
  if (m.repeat === 'nmonth') {
    const n = Math.max(2, Number(m.repeat_n) || 2);
    if (!st) return false;
    /* 只落在「起始月起第 0、n、2n… 个月」上 */
    const dm = (dt.getFullYear() - st.getFullYear()) * 12 + (dt.getMonth() - st.getMonth());
    if (dm < 0 || dm % n !== 0) return false;
  }
  const day = Number(m.repeat_v) || 1;
  const dim = (pre && pre.dim) || new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
  return dt.getDate() === Math.min(day, dim);
}
function memoHitsKey(m, key) { const dt = parseDT(key); return !!dt && memoHitsDate(m, dt); }
function renderMemoCal(y, mo, byDay, sel, now) {
  const todayStr = fmtDate(now);
  const pad = new Date(y, mo, 1).getDay();
  const dim = new Date(y, mo + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < pad; i++) cells += '<span></span>';
  for (let d = 1; d <= dim; d++) {
    const dt = new Date(y, mo, d);
    const k = fmtDate(dt);
    const n = (byDay[k] || []).length;
    const cls = 'cal-cell' + (k < todayStr ? ' past' : '') + (k === todayStr ? ' today' : '') + (k === sel ? ' sel' : '');
    const fest = festivalOf(dt);
    cells += '<button class="' + cls + '" data-day="' + k + '"><span class="cd">' + d + '</span>' +
      '<span class="cl' + (fest ? ' fest' : '') + '">' + (fest || lunarShort(dt)) + '</span>' +
      (n ? '<span class="mk">' + (n > 9 ? '9+' : n) + '</span>' : '') + '</button>';
  }
  const cm = cardLunarMonth(y, mo);
  return '<div class="cal-head">' +
      '<div class="cal-ht"><span class="cal-title">' + y + '年' + (mo + 1) + '月<span class="ly">' + GAN_ZHI(cm.y) + '年</span><span class="lym">' + cm.mon + '</span></span>' +
        '<span class="cal-sub" id="calSelInfo">' + calSelHtml(sel) + '</span></div>' +
      '<div class="cal-nav"><button id="calPrev" aria-label="上个月">‹</button><button id="calToday">今</button><button id="calNext" aria-label="下个月">›</button>' +
        '<button id="calFold" aria-label="收起日历" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg></button></div>' +
    '</div>' +
    '<div class="cal-fold"><div class="cal-inner">' +
      '<div class="cal-wd"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>' +
      '<div class="cal-grid">' + cells + '</div>' +
    '</div></div>';
}
/* 标题后面那半句：选中某天时只显示这天是农历几号。
   这张月历的农历月已经写在标题里，节日也已经在格子里标出，所以这里都不重复 */
function calSelHtml(sel) {
  if (!sel) return '';
  return '<b>' + lunarParts(parseDT(sel)).day + '</b>';
}
function festNote(name) {
  const info = FEST_INFO[name] || ['', ''];
  return '<div class="fest-note"><div class="fn-head"><b>' + name + '</b><span>' + info[0] + '</span></div>' +
    (info[1] ? '<p>' + info[1] + '</p>' : '') + '</div>';
}
function memoStamp(m) {
  return String(m.memo_time || '') + ' ' + (m.memo_clock || '');
}
/* 看某天那天的列表按当天时刻排（定期备忘的起始日不等于这天，不能再拿 memoStamp 排） */
function byClock(a, b) {
  const ka = a.memo_clock || '', kb = b.memo_clock || '';
  return ka === kb ? memoStamp(a).localeCompare(memoStamp(b)) : (ka < kb ? -1 : 1);
}
function renderMemos() {
  const p = $('#p-memos');
  if (!p) return;
  const now = new Date();
  if (ui.calY == null) { ui.calY = now.getFullYear(); ui.calM = now.getMonth(); }
  const byDay = {};
  /* 一次性备忘按原日期入桶；定期备忘只算当前这一个月：日期对象和日期串整个月各建一次 */
  const dimNow = new Date(ui.calY, ui.calM + 1, 0).getDate();
  const dayDts = [], dayKeys = [];
  for (let d = 1; d <= dimNow; d++) {
    const dt = new Date(ui.calY, ui.calM, d);
    dayDts.push(dt); dayKeys.push(fmtDate(dt));
  }
  state.memos.forEach(m => {
    if (!m.repeat) { const k = memoDayKey(m); if (k) (byDay[k] = byDay[k] || []).push(m); return; }
    const pre = { st: parseDT(m.memo_time), dim: dimNow };
    for (let d = 0; d < dimNow; d++) {
      if (!memoHitsDate(m, dayDts[d], pre)) continue;
      const k = dayKeys[d];
      (byDay[k] = byDay[k] || []).push(m);
    }
  });

  p.innerHTML =
    '<div class="memo-sticky">' +
      pageHead('备忘', '共 ' + state.memos.length + ' 条 · ' + (festivalOf(now) || '农历' + lunarMD(now)), '',
        '<button class="btn dark" id="addMemo">＋ 备忘</button>') +
      '<div class="cal' + (ui.calFold ? ' folded' : '') + '" id="memoCal">' + renderMemoCal(ui.calY, ui.calM, byDay, ui.memoDay, now) + '</div>' +
      '<div class="memo-search">' +
        '<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="mKw" placeholder="搜索备忘内容"></div>' +
        '<button class="btn ghost sm" id="mKwClear">清除</button>' +
      '</div>' +
    '</div>' +
    '<div id="memoBody"></div>';

  const kwEl = $('#mKw');
  kwEl.value = ui.memoKw;
  let kwTimer = 0;
  kwEl.addEventListener('input', () => {
    const wasEmpty = !ui.memoKw;
    ui.memoKw = kwEl.value;
    /* 一开口搜就把日期选中让开：搜索是全库搜，不想跟「只看某天」打架 */
    if (wasEmpty && ui.memoKw.trim()) { ui.memoDay = null; paintCalSel(); }
    clearTimeout(kwTimer);
    kwTimer = setTimeout(() => paintMemoBody(byDay, now), 120);
  });
  $('#mKwClear').addEventListener('click', () => {
    clearTimeout(kwTimer);
    ui.memoKw = '';
    kwEl.value = '';
    paintMemoBody(byDay, now);
  });

  $('#addMemo').addEventListener('click', () => openMemoForm(ui.memoDay ? { memo_time: ui.memoDay } : null));
  /* 日历一次委托：点日期只换选中态 + 重刷下方列表，不再整块重建 */
  $('#memoCal').addEventListener('click', e => {
    const dayBtn = e.target.closest ? e.target.closest('[data-day]') : null;
    if (dayBtn) {
      /* 点日期就退出搜索，回到「只看这一天」 */
      if (ui.memoKw) { ui.memoKw = ''; if (kwEl) kwEl.value = ''; }
      ui.memoDay = (ui.memoDay === dayBtn.dataset.day) ? null : dayBtn.dataset.day;
      paintCalSel();
      paintMemoBody(byDay, now);
      return;
    }
    const btn = e.target.closest ? e.target.closest('button') : null;
    const id = btn && btn.id;
    if (id === 'calPrev') { ui.calM -= 1; if (ui.calM < 0) { ui.calM = 11; ui.calY -= 1; } renderMemos(); }
    else if (id === 'calNext') { ui.calM += 1; if (ui.calM > 11) { ui.calM = 0; ui.calY += 1; } renderMemos(); }
    else if (id === 'calFold') {
      ui.calFold = !ui.calFold;
      const cal = $('#memoCal');
      cal.classList.toggle('folded', ui.calFold);
      btn.setAttribute('aria-expanded', ui.calFold ? 'false' : 'true');
      btn.setAttribute('aria-label', ui.calFold ? '展开日历' : '收起日历');
    }
    else if (id === 'calToday') {
      ui.calY = now.getFullYear(); ui.calM = now.getMonth();
      ui.memoDay = byDay[fmtDate(now)] ? fmtDate(now) : null;
      renderMemos();
    }
  });
  paintMemoBody(byDay, now);
}

/* 只更新日历的选中框与脚注（切日期、取消选中都走这里） */
function paintCalSel() {
  const sel = ui.memoDay;
  $$('#memoCal [data-day]').forEach(b => b.classList.toggle('sel', b.dataset.day === sel));
  const info = $('#calSelInfo');
  if (info) info.innerHTML = calSelHtml(sel);
}

/* 换日期时先渐隐旧卡片，等它暗下去再重建内容并渐显；连点会接管上一条动画 */
function crossFadeMemo(host, build) {
  const tok = host.__fx = (host.__fx || 0) + 1;
  host.classList.remove('fx-in');
  host.classList.add('fx-out');
  setTimeout(() => {
    if (host.__fx !== tok) return;
    build();
    host.classList.remove('fx-out');
    host.classList.add('fx-in');
    setTimeout(() => { if (host.__fx === tok) host.classList.remove('fx-in'); }, 300);
  }, 165);
}
/* 备忘列表 + 标题 + 节日提示：依赖日历已建好的日期分布，单独刷新 */
function paintMemoBody(byDay, now) {
  const host = $('#memoBody');
  if (!host) return;
  const build = () => {
    const kw = (ui.memoKw || '').trim().toLowerCase();
    const sel = kw ? null : ui.memoDay;
    /* 有日期的按日期归位；没日期的纯备案单独放最后一节，不进日历、不参与某天筛选 */
    /* 一次遍历分出「有日期 / 未定日期」：原来两个 filter 各解一遍 memoDayKey */
    const datedAll = [], undated = [];
    state.memos.forEach(m => {
      if (memoDayKey(m)) datedAll.push(m);
      else if (m.content) undated.push(m);
    });
    undated.sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
    /* 选中某天时按「这一天是否命中」现算：翻到别的月份后，选中日期仍要准确 */
    const list = kw
      ? state.memos.filter(m => String(m.content || '').toLowerCase().indexOf(kw) >= 0)
          .sort((a, b) => memoStamp(b).localeCompare(memoStamp(a)))
      : sel
        ? state.memos.filter(m => memoHitsKey(m, sel)).sort(byClock)
        : datedAll.slice().sort((a, b) => memoStamp(b).localeCompare(memoStamp(a)));
    const title = kw
      ? ('搜索「' + ui.memoKw.trim() + '」· ' + list.length + ' 条')
      : sel
        ? (mdWd(parseDT(sel)) + ' · ' + list.length + ' 条')
        : ('全部备忘 · ' + (datedAll.length + undated.length) + ' 条');
    const selFest = sel ? festivalOf(parseDT(sel)) : '';
    const right = kw
      ? '<button class="btn ghost sm" id="memoClear">清除搜索</button>'
      : sel ? '<button class="btn ghost sm" id="memoClear">看全部</button>' : '点日期筛选';

    host.innerHTML =
      (selFest ? festNote(selFest) : '') +
      sectionTitle(title, right) +
      '<div class="rows" id="memoList"></div>';

    const clr = $('#memoClear');
    if (clr) clr.addEventListener('click', () => {
      ui.memoKw = '';
      const el = $('#mKw');
      if (el) el.value = '';
      ui.memoDay = null;
      paintCalSel();
      paintMemoBody(byDay, now);
    });

    const rowHtml = (m, isUndated) => {
      const d = parseDT(m.memo_time);
      const md = d ? (d.getMonth() + 1) + '/' + d.getDate() : '';
      const clk = m.memo_clock || '';
      const rep = memoRepeatText(m);
      /* 选了某一天就只显示时刻；看全部时日期在上、时刻在下；定期备忘用「每周三/每月15号」代替日期；未定日期不挂任何小标 */
      const left = isUndated

    } else {

      box.innerHTML = list.map(m => rowHtml(m, false)).join('') +

          : '');

  /* 第一次填内容、或同一天的重刷（比如刚存完一条）不演动画 */
  if (prevKey !== undefined && prevKey !== key) crossFadeMemo(host, build);
  else build();
}

    $$('#mRepWeek .chip').forEach(x => x.classList.toggle('on', rep === 'week' && Number(x.dataset.v) === repV));
    $$('#mRepGap .chip').forEach(x => x.classList.toggle('on', rep === 'nmonth' && Number(x.dataset.v) === repN));
    $$('#mRepMonth .chip').forEach(x => x.classList.toggle('on', (rep === 'month' || rep === 'nmonth') && Number(x.dataset.v) === repV));

      : '只出现这一次，日期过了就不再出现';
  };

  $$('#mRepMonth .chip').forEach(b => b.addEventListener('click', () => { rep = rep === 'nmonth' ? 'nmonth' : 'month'; repV = Number(b.dataset.v); repTouch = true; paintRep(); }));
  $$('#mRepGap .chip').forEach(b => b.addEventListener('click', () => { rep = 'nmonth'; repN = Number(b.dataset.v); repTouch = true; paintRep(); }));
  $('#mNoDate').addEventListener('click', () => { noDate = !noDate; paintNoDate(); });
  bindPickerField({
    btn: '#mTime', label: '#mTimeVal', mode: 'date',
    get: () => tv, set: v => { tv = v; if (rep && !repTouch) { seedRep(); paintRep(); } }, text: v => mdWd(parseDT(v) || new Date())
  });
  bindPickerField({
    btn: '#mClock', label: '#mClockVal', mode: 'time',
    get: () => clk || fmtHM(new Date()), set: v => { clk = v; }, text: v => v,

  $('#mClockClear').addEventListener('click', () => {
    clk = '';
    const n = $('#mClockVal'); n.textContent = '不设时间'; n.className = 'ph';
  });
  $('#mSave').addEventListener('click', () => {
    const content = $('#mContent').value.trim();
    if (!content) { toast('请填写内容'); return; }
    const obj = {
      id: m.id || uid(),
      memo_time: noDate ? '' : tv,
      memo_clock: noDate ? '' : (clk || ''),
      repeat: noDate ? '' : rep,
      repeat_v: (noDate || !rep) ? '' : repV,
      repeat_n: (!noDate && rep === 'nmonth') ? repN : '',
      content,
      remark: $('#mRemark').value.trim(), created_at: m.id ? m.created_at : fmtDT(new Date())
    };
    if (m.id) state.memos = upsertById(state.memos, obj);
    else state.memos.unshift(obj);
    persist('memos');
    commitSheet('已保存');
  });
  if (m.id) {
    onDelete('#mDel', '删除这条备忘？', () => {
      state.memos = dropById(state.memos, m.id);
      persist('memos');
    });
  }
}

/* =====================================================================
   云同步（Supabase · 多人共用一份数据）
   ===================================================================== */
function cloudReady() { return !!(CLOUD.cfg && CLOUD.cfg.url && CLOUD.cfg.key && CLOUD.cfg.space); }
/* 改同步状态并立刻刷新角标 */
function setCloudStatus(s) { CLOUD.status = s; cloudBadge(); }
function cloudBase() { return String(CLOUD.cfg.url).replace(/\/+$/, '').replace(/\/rest\/v1$/, '') + '/rest/v1/fgrs_spaces'; }
function cloudHdr(extra) {
  const h = { 'apikey': CLOUD.cfg.key, 'Content-Type': 'application/json' };
  if (/^eyJ/.test(String(CLOUD.cfg.key))) h['Authorization'] = 'Bearer ' + CLOUD.cfg.key;
  return Object.assign(h, extra || {});
}
function collectAll() {
  return {
    app: 'fyrs', v: 1, ts: Date.now(),
    rules: state.rules, expenses: state.expenses,
    memos: state.memos, repay: state.repay, schedule: state.schedule,
    cats: state.cats || null
  };
}
async function cloudGet(select) {
  const u = cloudBase() + '?space=eq.' + encodeURIComponent(CLOUD.cfg.space) + '&select=' + select;
  const r = await fetch(u, { headers: cloudHdr(), cache: 'no-store' });
  if (!r.ok) throw new Error('读取失败 ' + r.status + '（' + (await r.text()).slice(0, 90) + '）');
  const rows = await r.json();
  return Array.isArray(rows) ? rows : [];
}
/* 记下云端最后更新时间：内存 + 配置一起落盘 */
function markCloudAt(ts) {
  CLOUD.lastAt = ts;
  if (!CLOUD.cfg) return;
  CLOUD.cfg.lastAt = ts;
  save(CLOUD_KEY, CLOUD.cfg);
}
async function cloudPush(force) {
  if (!cloudReady()) return false;
  /* 防覆盖闸：本机某模块明显少于云端时拒绝上传，防止空设备把云端账本冲掉 */
  if (!force) {
    const names = { expenses: '花销', memos: '备忘', schedule: '日程', repay: '还款计划' };
    let rp = null, remoteEmpty = false, checked = false;
    try {
      const r = await fetch(cloudBase() + '?select=payload&space=eq.' + encodeURIComponent(CLOUD.cfg.space), { headers: cloudHdr() });
      if (r.ok) {
        checked = true;
        const z = await r.json();
        if (!z.length) remoteEmpty = true; else rp = z[0].payload || {};
      }
    } catch (e) { }
    if (checked && !remoteEmpty) {
      const hit = ['expenses', 'memos', 'schedule', 'repay'].filter(function (k) {
        const rn = ((rp && rp[k]) || []).length, ln = (state[k] || []).length;
        return (rn >= 8 && ln <= 2) || (rn >= 12 && ln < rn * 0.5);
      })[0];
      if (hit) {
        CLOUD.dirty = false; setCloudStatus('error');
        toast('本机' + names[hit] + '只有 ' + (state[hit] || []).length + ' 条、云端 ' + (rp[hit] || []).length + ' 条，已阻止覆盖；要用云端的就点「云端 → 本机」');
        return false;
      }
    } else if (!checked) {
      /* 查不到云端：本机几乎空白就不推，弱网下宁可先囤在本地 */
      if (!(state.expenses || []).length && !(state.memos || []).length && !(state.schedule || []).length) {
        CLOUD.dirty = true; setCloudStatus('error');
        toast('连不上云端且本机没数据，已暂停上传');
        return false;
      }
    }
  }
  clearTimeout(CLOUD.timer); CLOUD.timer = null;
  CLOUD.dirty = false;
  const iso = new Date().toISOString();
  const r = await fetch(cloudBase() + '?on_conflict=space', {
    method: 'POST',
    headers: cloudHdr({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify([{ space: CLOUD.cfg.space, payload: collectAll(), updated_at: iso }])
  });
  if (!r.ok) {
    setCloudStatus('error');
    throw new Error('上传失败 ' + r.status + '（' + (await r.text()).slice(0, 90) + '）');
  }
  markCloudAt(Date.parse(iso));
  setCloudStatus('ok');
  return true;
}
function cloudMarkDirty() {
  if (!CLOUD.booted || !CLOUD.cfg || CLOUD.applying) return;
  CLOUD.dirty = true;
  clearTimeout(CLOUD.timer);
  CLOUD.timer = setTimeout(() => {
    cloudPush().catch(err => { toast('云同步失败：' + err.message); });
  }, 1400);
}
/* 本机是否已经有内容（用来判断自动同步能不能直接落地） */
function localHasData() {
  return ['expenses', 'memos', 'repay', 'schedule', 'cats'].some(k => (state[k] || []).length > 0);
}
function applyCloud(p) {
  if (!p) return;
  CLOUD.applying = true;
  /* 键名与 K 一一对应，null 表示这次不覆盖（比如云端没存分类） */
  ['rules', 'expenses', 'memos', 'repay', 'schedule', 'cats'].forEach(k => {
    if (p[k] === undefined || p[k] === null) return;
    /* 云端账目是空数组而本机有账目时，宁可不覆盖（防误清空） */
    if (k !== 'rules' && k !== 'cats' && !(p[k] || []).length && (state[k] || []).length) {
      toast('云端' + ({ expenses: '花销', memos: '备忘', repay: '还款计划', schedule: '日程' }[k] || k) + '是空的，本机有 ' + state[k].length + ' 条，已跳过覆盖');
      return;
    }
    state[k] = p[k];
    persist(k);
  });
  CLOUD.applying = false;
  ui.bannerSig = ''; ui.lastAmount = null;
  bumpData();
  cloudBadge();
}
async function cloudPull(rows, quiet) {
  rows = rows || await cloudGet('updated_at');
  if (!rows.length) return false;
  const at = Date.parse(rows[0].updated_at) || 0;
  if (at <= CLOUD.lastAt + 500) return false;
  const full = await cloudGet('updated_at,payload');
  if (!full.length) return false;
  const p = full[0].payload || {};
  /* 自动同步（quiet）：本机数据正常时绝不覆盖；本机几乎空白（≤2 笔且无备忘/日程）时视作空设备，允许落地 */
  if (quiet) {
    const thin = (state.expenses || []).length <= 2 && !(state.memos || []).length && !(state.schedule || []).length;
    if (localHasData() && !thin) return false;
    if (thin && ((p.expenses || []).length >= 8 || (p.memos || []).length >= 8)) {
      toast('云端有 ' + (p.expenses || []).length + ' 笔花销 / ' + (p.memos || []).length + ' 条备忘，已自动恢复');
    }
  }
  applyCloud(p);
  markCloudAt(Date.parse(full[0].updated_at) || at);
  if (!quiet) toast('已同步最新数据');
  return true;
}
async function cloudPoll() {
  if (!cloudReady() || CLOUD.dirty || CLOUD.applying) return;
  try {
    await cloudPull(null, false);
    setCloudStatus('ok');
  } catch (e) { setCloudStatus('error'); }
}
async function cloudBoot() {
  if (!cloudReady()) return;
  CLOUD.booted = true;
  try {
    const rows = await cloudGet('updated_at');
    if (!rows.length) {
      await cloudPush();
    } else {
      await cloudPull(rows, true);
      CLOUD.status = 'ok';
    }
    cloudBadge();
  } catch (e) { setCloudStatus('error'); }
}
function cloudBadge() {
  const dot = $('#cloudDot');
  if (dot) dot.style.background = !CLOUD.cfg ? '#cfcfd4' : CLOUD.status === 'error' ? '#b3261e' : CLOUD.status === 'ok' ? '#38383C' : '#dfa100';
  const btn = $('#cloudBtn');
  if (btn) btn.title = '云同步 · ' + (!CLOUD.cfg ? '未开启' : CLOUD.status === 'ok' ? '已连接' : CLOUD.status === 'error' ? '连接异常' : '连接中');
}
function openCloudPanel() {

  openSheet(

    '<div class="sheet-actions"><button class="btn dark wide" id="cConnect">保存并连接</button></div>' +

  });

  $('#cOff').addEventListener('click', () => {
    if (!confirm('断开云同步？本机数据保留，云端数据不动')) return;
    CLOUD.cfg = null; CLOUD.status = 'off'; CLOUD.booted = false; CLOUD.lastAt = 0;
    try { localStorage.removeItem(CLOUD_KEY); } catch (e) { }
    cloudBadge(); closeSheet(); toast('已断开云同步');
  });
}

/* =====================================================================
   定时刷新 / 初始化
   ===================================================================== */
let lastSlot = -1;
function tick() {
  if (document.hidden) return;
  const slot = Math.floor(Date.now() / 10000);
  if (slot === lastSlot) return;
  lastSlot = slot;
  if (ui.mounted.home && ui.curTab === 'home') updateLive();
  if (ui.mounted.agenda && ui.curTab === 'agenda') {
    /* 日期也进签名：跨过零点要重新排 7 天分组 */
    const n = new Date();
    const ids = fmtDate(n) + '#' + scheduleNowAll(n).map(s => s.id).join('|');
    if (ids !== ui.schedSig) {
      const y = window.scrollY;
      renderAgenda();
      requestAnimationFrame(() => window.scrollTo(0, y));
    }
  }
  if (CLOUD.booted && navigator.onLine !== false) cloudPoll();
}
setInterval(() => { if (!document.hidden) tick(); }, 1000);
/* 板块入场动画演完就摘类：别让 transform 常驻在 .page 上影响里面的 fixed 子元素 */
document.addEventListener('animationend', (e) => {
  if (e.animationName === 'pageIn' && e.target && e.target.classList) e.target.classList.remove('pageIn');
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { lastSlot = -1; tick(); if (ui.curTab === 'home') updateLive(); }
});
window.addEventListener('scroll', tabbarTrack, { passive: true });
window.addEventListener('resize', () => {
  clearTimeout(window.__rz);
  window.__rz = setTimeout(() => { placeTabInd(false); if (ui.mounted.home) { drawBalanceChart(); drawSpendChart(); } }, 220);
});

migrateLegacyCats();
migrateMemoClock();
renderTabbar();
ui.mounted.home = true;
RENDERERS.home = renderHome;
RENDERERS.expenses = renderExpenses;
RENDERERS.agenda = renderAgenda;
RENDERERS.memos = renderMemos;
renderHome();
lastSlot = -1;
tick();
if (CLOUD.cfg) cloudBoot();
</script>
</body>
</html>
